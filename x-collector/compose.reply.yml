name: x-collector-reply
x-service: &service
  build: .
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://collector:${REPLY_DB_PASSWORD:?set REPLY_DB_PASSWORD}@postgres:5432/x_collector
    REPLY_API_HOST: 0.0.0.0
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${REPLY_DB_PASSWORD:?set REPLY_DB_PASSWORD}
      POSTGRES_DB: x_collector
    volumes: [reply_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U collector -d x_collector"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *service
    restart: "no"
    command: [node, dist/scripts/migrate.js]
    profiles: [setup, collector]
  api:
    <<: *service
    ports: ["127.0.0.1:3002:3002"]
    command: [node, dist/scripts/reply/api.js]
  supervisor:
    <<: *service
    command: [node, dist/scripts/reply/supervisor.js]
    stop_grace_period: 90s
  telegram:
    <<: *service
    profiles: [telegram]
    network_mode: service:api
    environment:
      DATABASE_URL: postgresql://collector:${REPLY_DB_PASSWORD:?set REPLY_DB_PASSWORD}@postgres:5432/x_collector
      REPLY_API_URL: http://127.0.0.1:3002
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: [node, dist/scripts/reply/telegram.js]
    stop_grace_period: 45s
  worker:
    <<: *service
    profiles: [collector]
    command: [node, dist/scripts/worker.js]
    volumes: [collector_data:/app/data, collector_logs:/app/logs]
    stop_grace_period: 45s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+(process.env.METRICS_PORT||9091)+'/health',{headers:process.env.METRICS_USER?{authorization:'Basic '+Buffer.from(process.env.METRICS_USER+':'+process.env.METRICS_PASS).toString('base64')}:{}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    <<: *service
    profiles: [collector]
    command: [node, dist/scripts/scheduler.js]
    stop_grace_period: 100s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  dashboard:
    <<: *service
    profiles: [collector]
    command: [node, dist/scripts/dashboard.js]
    environment:
      DATABASE_URL: postgresql://collector:${REPLY_DB_PASSWORD:?set REPLY_DB_PASSWORD}@postgres:5432/x_collector
      DASHBOARD_HOST: 0.0.0.0
      COLLECTOR_AUTOSTART: "false"
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASS: ${DASHBOARD_PASS:-}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-}
    ports: ["127.0.0.1:3001:3001"]
    volumes: [collector_data:/app/data, collector_logs:/app/logs]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
volumes:
  reply_pg:
  collector_data:
  collector_logs:
