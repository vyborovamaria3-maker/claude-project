services:
  backend:
    image: ${LEGACY_MINIAPP_IMAGE:?LEGACY_MINIAPP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/miniapp.db
    volumes:
      - legacy_miniapp_data:/data
    ports:
      - "127.0.0.1:${LEGACY_MINIAPP_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  legacy_miniapp_data:
    name: legacy_miniapp_data
