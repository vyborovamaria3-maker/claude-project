<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>POTAPoff Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050816;
        color: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 24px;
        padding: 24px;
        background: rgba(10,15,31,.72);
        box-shadow: 0 20px 70px rgba(0,0,0,.3);
      }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0; line-height: 1.6; color: rgba(255,255,255,.7); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>POTAPoff Mini App</h1>
      <p>This fallback shell is only for safe loading. The production app is rendered by the React entrypoint.</p>
    </div>
  </body>
  </html>
