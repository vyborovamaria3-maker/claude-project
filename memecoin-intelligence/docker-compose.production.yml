services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memecoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memecoin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
      SECURITY_HEADERS_STRICT: "true"
      SECURITY_RBAC_ENABLED: "true"
      INTERNAL_ADMIN_API_KEY: ${INTERNAL_ADMIN_API_KEY:?set INTERNAL_ADMIN_API_KEY}
      # Scoped server-to-server credential used by the POTAPoff frontend only for
      # non-admin analysis endpoints such as /api/telegram-ai/analyze.
      INTERNAL_USER_API_KEY: ${MEMECOIN_INTELLIGENCE_API_KEY:?set MEMECOIN_INTELLIGENCE_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-memecoin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memecoin}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      TELEGRAM_AI_ENABLED: ${TELEGRAM_AI_ENABLED:-true}
      # Production never silently falls back to the deterministic mock. If the
      # real inference service is unavailable, callers receive a degraded/error
      # state instead of a fake Qwen verdict.
      TELEGRAM_AI_MODE: ${TELEGRAM_AI_MODE:-openai-compatible}
      TELEGRAM_AI_BASE_URL: ${TELEGRAM_AI_BASE_URL:-http://qwen:8000/v1}
      TELEGRAM_AI_API_KEY: ${TELEGRAM_AI_API_KEY:-}
      TELEGRAM_AI_MODEL: ${TELEGRAM_AI_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      TELEGRAM_AI_MAX_TOKENS: ${TELEGRAM_AI_MAX_TOKENS:-3200}
    command: ["npm", "start"]
    # Host binding is loopback-only for local operations. Cross-stack traffic
    # uses the private potapoff-shared Docker network below.
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      default:
      potapoff-shared:
        aliases:
          - memecoin-intelligence-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SECURITY_HEADERS_STRICT: "true"
      SECURITY_RBAC_ENABLED: "true"
      INTERNAL_ADMIN_API_KEY: ${INTERNAL_ADMIN_API_KEY:?set INTERNAL_ADMIN_API_KEY}
      INTERNAL_USER_API_KEY: ${MEMECOIN_INTELLIGENCE_API_KEY:?set MEMECOIN_INTELLIGENCE_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-memecoin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memecoin}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      TELEGRAM_AI_ENABLED: ${TELEGRAM_AI_ENABLED:-true}
      TELEGRAM_AI_MODE: ${TELEGRAM_AI_MODE:-openai-compatible}
      TELEGRAM_AI_BASE_URL: ${TELEGRAM_AI_BASE_URL:-http://qwen:8000/v1}
      TELEGRAM_AI_API_KEY: ${TELEGRAM_AI_API_KEY:-}
      TELEGRAM_AI_MODEL: ${TELEGRAM_AI_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      TELEGRAM_AI_MAX_TOKENS: ${TELEGRAM_AI_MAX_TOKENS:-3200}
    command: ["npm", "run", "start:worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  qwen:
    profiles: ["ai"]
    build: ./ai/qwen-service
    restart: unless-stopped
    environment:
      QWEN_MODEL_ID: ${QWEN_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      QWEN_REVISION: ${QWEN_REVISION:-}
      QWEN_LOAD_MODE: ${QWEN_LOAD_MODE:-4bit}
      QWEN_MAX_INPUT_TOKENS: ${QWEN_MAX_INPUT_TOKENS:-8192}
      QWEN_MAX_OUTPUT_TOKENS: ${QWEN_MAX_OUTPUT_TOKENS:-3200}
      # Production must fail at startup if the configured GPU/model cannot load;
      # otherwise /health can look green until the first real generation fails.
      QWEN_LAZY_LOAD: ${QWEN_LAZY_LOAD:-false}
      QWEN_SERVICE_API_KEY: ${TELEGRAM_AI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
    # Keep inference private. The host binding is only for local health/debug;
    # the intelligence API calls qwen:8000 over this compose's default network.
    ports:
      - "127.0.0.1:${QWEN_HOST_PORT:-8002}:8000"
    volumes:
      - hf_cache:/models/huggingface
    gpus: all

volumes:
  postgres_data:
  redis_data:
  hf_cache:

networks:
  potapoff-shared:
    external: true
