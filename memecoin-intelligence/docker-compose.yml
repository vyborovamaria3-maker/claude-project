services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memecoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memecoin}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports: ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: npm run dev:api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memecoin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memecoin}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      TELEGRAM_AI_BASE_URL: ${TELEGRAM_AI_DOCKER_BASE_URL:-http://qwen:8000/v1}
    volumes: [".:/app", "/app/node_modules"]
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: npm run dev:worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memecoin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memecoin}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      TELEGRAM_AI_BASE_URL: ${TELEGRAM_AI_DOCKER_BASE_URL:-http://qwen:8000/v1}
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: .
    command: npm run dev:web -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:3001
    volumes: [".:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

  qwen:
    profiles: ["ai"]
    build: ./ai/qwen-service
    environment:
      QWEN_MODEL_ID: ${QWEN_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      QWEN_REVISION: ${QWEN_REVISION:-}
      QWEN_LOAD_MODE: ${QWEN_LOAD_MODE:-4bit}
      QWEN_MAX_INPUT_TOKENS: ${QWEN_MAX_INPUT_TOKENS:-8192}
      QWEN_MAX_OUTPUT_TOKENS: ${QWEN_MAX_OUTPUT_TOKENS:-1536}
      QWEN_LAZY_LOAD: ${QWEN_LAZY_LOAD:-true}
      HF_TOKEN: ${HF_TOKEN:-}
      QWEN_SERVICE_API_KEY: ${TELEGRAM_AI_API_KEY:-}
      HF_HOME: /models/huggingface
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["hf_cache:/models/huggingface"]
    gpus: all
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  hf_cache:
