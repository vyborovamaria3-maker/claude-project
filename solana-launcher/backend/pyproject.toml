[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "potapoff-backend"
version = "0.1.0"
description = "FastAPI backend for solana-launcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyJWT>=2.13,<3",
  "cryptography>=42",
  "bcrypt==4.0.1",
  "passlib[bcrypt]>=1.7.4",
  "itsdangerous>=2.2",
  "base58>=2.1",
  "pynacl>=1.5",
  "python-multipart>=0.0.9",
  "sqladmin>=0.18",
  "wtforms>=3.1",
  "celery>=5.4",
  "redis>=5.0",
  "prometheus-fastapi-instrumentator>=7.0",
  "httpx>=0.27",
  "email-validator>=2.2",
  "telethon>=1.40,<2.0",
  "ijson>=3.3,<4.0",
]

[project.optional-dependencies]
teragram = [
  "duckdb>=1.4,<2.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "duckdb>=1.4,<2.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
