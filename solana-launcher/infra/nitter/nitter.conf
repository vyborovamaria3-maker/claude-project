[Server]
address = "0.0.0.0"
port = 8080
https = false
httpMaxConnections = 100
title = "Research Nitter"
hostname = "nitter.example.com"

[Cache]
listMinutes = 240
rssMinutes = 10
redisHost = "redis"
redisPort = 6379
redisPassword = ""
redisConnections = 20
redisMaxConnections = 30

[Config]
hmacKey = "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
base64Media = false
enableRSS = true
enableDebug = false
proxy = ""
proxyAuth = ""
tokenCount = 10

[Preferences]
theme = "Nitter"
replaceTwitter = "nitter.example.com"
replaceYouTube = "piped.video"
replaceReddit = "old.reddit.com"
proxyVideos = true
hlsPlayback = false
infiniteScroll = false
