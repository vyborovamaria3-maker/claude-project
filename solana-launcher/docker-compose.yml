services:
  postgres:
    image: postgres:16-alpine
    container_name: potapoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-potapoff}
      POSTGRES_USER: ${POSTGRES_USER:-potapoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in solana-launcher/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: potapoff-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in solana-launcher/.env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in solana-launcher/.env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: potapoff-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-potapoff}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in solana-launcher/.env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: potapoff-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-potapoff}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in solana-launcher/.env}@postgres:5432/${POSTGRES_DB:-potapoff}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in solana-launcher/.env}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-potapoff}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in solana-launcher/.env}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in solana-launcher/.env}@redis:6379/1
      FRONTEND_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set in solana-launcher/.env}
      FRONTEND_INTERNAL_URL: http://frontend:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: potapoff-celery-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-potapoff}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in solana-launcher/.env}@postgres:5432/${POSTGRES_DB:-potapoff}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in solana-launcher/.env}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-potapoff}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in solana-launcher/.env}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in solana-launcher/.env}@redis:6379/1
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set in solana-launcher/.env}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set in solana-launcher/.env}}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL:-https://t.me/Soft777bot}
    container_name: potapoff-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set in solana-launcher/.env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set in solana-launcher/.env}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set in solana-launcher/.env}}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MEMECOIN_INTELLIGENCE_URL: ${MEMECOIN_INTELLIGENCE_URL:-http://host.docker.internal:3001}
      MEMECOIN_INTELLIGENCE_API_KEY: ${MEMECOIN_INTELLIGENCE_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL:-https://t.me/Soft777bot}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/miniapp').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: potapoff-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - potapoff-shared

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: potapoff-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

volumes:
  postgres-data:
  redis-data:
  frontend_node_modules:

networks:
  potapoff-shared:
    external: true
