services:
  backend:
    build:
      context: ${POTAPOFF_SOURCE_ROOT:-/opt/claude-project}/solana-launcher/backend
      dockerfile: Dockerfile

  celery-worker:
    build:
      context: ${POTAPOFF_SOURCE_ROOT:-/opt/claude-project}/solana-launcher/backend
      dockerfile: Dockerfile

  twitter-discovery:
    build:
      context: ${POTAPOFF_SOURCE_ROOT:-/opt/claude-project}/solana-launcher/backend
      dockerfile: Dockerfile

  frontend:
    build:
      context: ${POTAPOFF_SOURCE_ROOT:-/opt/claude-project}/solana-launcher
      dockerfile: Dockerfile.frontend.prod
      args:
        NEXT_PUBLIC_APP_URL: https://potapoff.fun
        NEXT_PUBLIC_FRONTEND_URL: https://potapoff.fun
        NEXT_PUBLIC_BACKEND_URL: https://potapoff.fun/fastapi
        NEXT_PUBLIC_TELEGRAM_BOT_URL: https://t.me/Soft777bot
        NEXT_PUBLIC_BUILD_SHA: ${IMAGE_TAG:-local}

  telegram-bot:
    build:
      context: ${POTAPOFF_SOURCE_ROOT:-/opt/claude-project}/solana-launcher
      dockerfile: Dockerfile.telegram-bot
