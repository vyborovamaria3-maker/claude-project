version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ai-reply-guy-db
    environment:
      POSTGRES_USER: ai_reply_guy
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: ai_reply_guy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_reply_guy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ai-reply-guy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai-reply-guy-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ai_reply_guy
      RABBITMQ_DEFAULT_PASS: secure_password_123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: ai-reply-guy-backend
    environment:
      DATABASE_URL: postgresql://ai_reply_guy:secure_password_123@postgres:5432/ai_reply_guy
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://ai_reply_guy:secure_password_123@rabbitmq:5672/
      ENCRYPTION_KEY: your-32-byte-encryption-key-here
      JWT_SECRET: your-super-secret-jwt-key
      TELEGRAM_BOT_TOKEN: your-telegram-bot-token
      LLM_API_KEY: sk-your-openai-key
      LLM_PROVIDER: openai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Telegram Bot
  telegram-bot:
    build: ./telegram-bot
    container_name: ai-reply-guy-telegram
    environment:
      TELEGRAM_BOT_TOKEN: your-telegram-bot-token
      API_URL: http://backend:8000
      DATABASE_URL: postgresql://ai_reply_guy:secure_password_123@postgres:5432/ai_reply_guy
    depends_on:
      - backend
    volumes:
      - ./telegram-bot:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  # Workers (spawned per campaign)
  worker:
    build: ./worker
    container_name: ai-reply-guy-worker
    environment:
      DATABASE_URL: postgresql://ai_reply_guy:secure_password_123@postgres:5432/ai_reply_guy
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://ai_reply_guy:secure_password_123@rabbitmq:5672/
      LLM_API_KEY: sk-your-openai-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./worker:/app
    command: python app/worker.py

  # Frontend (Next.js)
  frontend:
    build: ./frontend
    container_name: ai-reply-guy-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_TELEGRAM_BOT_URL: https://t.me/your-bot
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
