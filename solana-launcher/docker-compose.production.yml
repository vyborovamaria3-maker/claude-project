name: potapoff

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: potapoff
      POSTGRES_USER: potapoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potapoff -d potapoff"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - data-network
    logging: *default-logging

  postgres-role-provisioner:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: potapoff
      PGUSER: ${POSTGRES_USER:-potapoff}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-potapoff_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-potapoff_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-potapoff_backup}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD is required}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-potapoff_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?POSTGRES_READONLY_PASSWORD is required}
    volumes:
      - ./scripts/provision-postgres-roles.sql:/provision/roles.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      psql -X -v ON_ERROR_STOP=1
      -v bootstrap_user="$${PGUSER}"
      -v app_user="$${POSTGRES_APP_USER}"
      -v app_password="$${POSTGRES_APP_PASSWORD}"
      -v migrator_user="$${POSTGRES_MIGRATOR_USER}"
      -v migrator_password="$${POSTGRES_MIGRATOR_PASSWORD}"
      -v backup_user="$${POSTGRES_BACKUP_USER}"
      -v backup_password="$${POSTGRES_BACKUP_PASSWORD}"
      -v readonly_user="$${POSTGRES_READONLY_USER}"
      -v readonly_password="$${POSTGRES_READONLY_PASSWORD}"
      -f /provision/roles.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-network
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: potapoff
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - data-network
    logging: *default-logging

  backend:
    image: ghcr.io/vyborovamaria3-maker/claude-project/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - backend.env
      - .env.runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-potapoff_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/potapoff
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_BROKER_URL: amqp://potapoff:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      FRONTEND_URL: https://potapoff.fun
      FRONTEND_INTERNAL_URL: http://frontend:3000
      CORS_ORIGINS: '["https://potapoff.fun","https://www.potapoff.fun"]'
      KOL_INTERNAL_KEY: ${KOL_INTERNAL_KEY:?KOL_INTERNAL_KEY is required}
      TG_INVITE_INTERNAL_KEY: ${TG_INVITE_INTERNAL_KEY:-}
      TG_INVITE_SESSION_ENCRYPTION_KEY: ${TG_INVITE_SESSION_ENCRYPTION_KEY:-}
      TG_INVITE_SESSION_PREVIOUS_KEYS: ${TG_INVITE_SESSION_PREVIOUS_KEYS:-}
      # Dedicated opt-in webhook secrets: backend only; never Next.js/browser.
      TG_INVITE_CONSENT_WEBHOOK_SECRET: ${TG_INVITE_CONSENT_WEBHOOK_SECRET:-}
      TG_INVITE_CONSENT_BOT_ID: ${TG_INVITE_CONSENT_BOT_ID:-}
      TG_INVITE_CONSENT_CHAT_BINDINGS: ${TG_INVITE_CONSENT_CHAT_BINDINGS:-}
      TG_INVITE_CONSENT_HMAC_KEY: ${TG_INVITE_CONSENT_HMAC_KEY:-}
      SOLANA_TRACKER_API_KEY: ${SOLANA_TRACKER_API_KEY:-}
      SOLANA_TRACKER_API_BASE: ${SOLANA_TRACKER_API_BASE:-https://data.solanatracker.io}
      KOL_TRADE_SYNC_INTERVAL_SECONDS: ${KOL_TRADE_SYNC_INTERVAL_SECONDS:-1200}
      KOL_TRADE_SYNC_WALLETS_PER_RUN: ${KOL_TRADE_SYNC_WALLETS_PER_RUN:-1}
      SUBSCRIPTION_INTERNAL_KEY: ${SUBSCRIPTION_INTERNAL_KEY:?SUBSCRIPTION_INTERNAL_KEY is required}
      REQUIRE_SUBSCRIPTION_INTERNAL_KEY: "true"
      SUBSCRIPTION_ADMIN_KEY: ${SUBSCRIPTION_ADMIN_KEY:-}
      REQUIRE_SUBSCRIPTION_ADMIN_KEY: "true"
    # Production migrations are owned by deploy-production.sh. Overriding the
    # image CMD keeps rollback compatible after a newer Alembic revision has
    # already been recorded in the database.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-role-provisioner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging

  celery-worker:
    image: ghcr.io/vyborovamaria3-maker/claude-project/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - backend.env
      - .env.runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-potapoff_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/potapoff
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_BROKER_URL: amqp://potapoff:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      SOLANA_TRACKER_API_KEY: ${SOLANA_TRACKER_API_KEY:-}
      SOLANA_TRACKER_API_BASE: ${SOLANA_TRACKER_API_BASE:-https://data.solanatracker.io}
      KOL_TRADE_SYNC_INTERVAL_SECONDS: ${KOL_TRADE_SYNC_INTERVAL_SECONDS:-1200}
      KOL_TRADE_SYNC_WALLETS_PER_RUN: ${KOL_TRADE_SYNC_WALLETS_PER_RUN:-1}
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    networks:
      - default
      - data-network
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  celery-beat:
    image: ghcr.io/vyborovamaria3-maker/claude-project/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - backend.env
      - .env.runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-potapoff_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/potapoff
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_BROKER_URL: amqp://potapoff:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      SOLANA_TRACKER_API_KEY: ${SOLANA_TRACKER_API_KEY:-}
      SOLANA_TRACKER_API_BASE: ${SOLANA_TRACKER_API_BASE:-https://data.solanatracker.io}
      KOL_TRADE_SYNC_INTERVAL_SECONDS: ${KOL_TRADE_SYNC_INTERVAL_SECONDS:-1200}
      KOL_TRADE_SYNC_WALLETS_PER_RUN: ${KOL_TRADE_SYNC_WALLETS_PER_RUN:-1}
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    networks:
      - default
      - data-network
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  twitter-discovery:
    image: ghcr.io/vyborovamaria3-maker/claude-project/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - backend.env
      - .env.runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-potapoff_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/potapoff
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_BROKER_URL: amqp://potapoff:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
    command: ["python", "-m", "app.cli.twitter_discovery_daemon", "--public-interval", "900", "--cycle-interval", "1800"]
    networks:
      - default
      - data-network
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  telegram-intelligence:
    profiles: ["telegram-intelligence"]
    image: ghcr.io/vyborovamaria3-maker/claude-project/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - backend.env
      - .env.runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-potapoff_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/potapoff
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SESSION_STRING: ${TG_SESSION_STRING:-}
      TG_MONITOR_CHANNELS: ${TG_MONITOR_CHANNELS:-}
      TG_HISTORY_LIMIT: ${TG_HISTORY_LIMIT:-300}
      TG_GRAPH_DEPTH: ${TG_GRAPH_DEPTH:-1}
      TG_ENTITY_LIMIT: ${TG_ENTITY_LIMIT:-100}
      TG_EVALUATE_INTERVAL_SECONDS: ${TG_EVALUATE_INTERVAL_SECONDS:-300}
    command: ["python", "-m", "app.cli.telegram_monitor"]
    networks:
      - default
      - data-network
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: ghcr.io/vyborovamaria3-maker/claude-project/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    # Deliberately keep the public frontend isolated from backend.env and provider secrets.
    environment:
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      TG_INVITE_INTERNAL_KEY: ${TG_INVITE_INTERNAL_KEY:-}
      KOL_INTERNAL_KEY: ${KOL_INTERNAL_KEY:?KOL_INTERNAL_KEY is required}
      SUBSCRIPTION_INTERNAL_KEY: ${SUBSCRIPTION_INTERNAL_KEY:?SUBSCRIPTION_INTERNAL_KEY is required}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY is required}
      FRONTEND_URL: https://potapoff.fun
      NEXT_PUBLIC_APP_URL: https://potapoff.fun
      NEXT_PUBLIC_FRONTEND_URL: https://potapoff.fun
      NEXT_PUBLIC_BACKEND_URL: https://potapoff.fun/fastapi
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    volumes:
      - ./data:/app/data
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000/miniapp'),fetch('http://127.0.0.1:3000/api/miniapp/config')]).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 60s
    logging: *default-logging

  telegram-bot:
    profiles: ["telegram"]
    image: ghcr.io/vyborovamaria3-maker/claude-project/telegram-bot:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:?TELEGRAM_WEBHOOK_URL is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      FRONTEND_URL: https://potapoff.fun
      NEXT_PUBLIC_APP_URL: https://potapoff.fun
      NEXT_PUBLIC_FRONTEND_URL: https://potapoff.fun
      NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL:-https://t.me/Soft777bot}
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - potapoff-shared
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - default
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  data-network:
    driver: bridge
  potapoff-shared:
    external: true
