name: Bridge observer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: ${{ github.event.pull_request.title == '[DEPLOY] POTAPoff landing v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Observe deployment bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow production-dispatch-bridge.yml \
              --limit 10 \
              --json databaseId,event,status,conclusion,createdAt,displayTitle,headSha \
              > /tmp/bridge-runs.json

            if jq -e '[.[] | select(.event == "pull_request_target")] | length > 0' /tmp/bridge-runs.json >/dev/null; then
              jq -r '([.[] | select(.event == "pull_request_target")][0]) as $r | "found=true\nrun_id=\($r.databaseId)\nstatus=\($r.status)\nconclusion=\($r.conclusion)\ncreated_at=\($r.createdAt)\ntitle=\($r.displayTitle)\nhead_sha=\($r.headSha)"' /tmp/bridge-runs.json > /tmp/bridge-result.txt
              cat /tmp/bridge-result.txt
              break
            fi

            echo 'found=false' > /tmp/bridge-result.txt
            cat /tmp/bridge-result.txt
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-observer-result
          path: |
            /tmp/bridge-result.txt
            /tmp/bridge-runs.json
          retention-days: 1
