name: solana-launcher-deploy

on:
  push:
    branches:
      - main
    paths:
      - "solana-launcher/**"
      - ".github/workflows/solana-launcher-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-launcher-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -se' <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail

          PROJECT_DIR="/var/www/claude-project"
          APP_DIR="$PROJECT_DIR/solana-launcher"
          COMPOSE_FILE="$PROJECT_DIR/solana-launcher/docker-compose.server.yml"

          cd "$PROJECT_DIR"
          git fetch origin main
          git reset --hard origin/main

          cd "$APP_DIR"
          docker compose --env-file .env.server -f "$COMPOSE_FILE" build frontend backend celery-worker telegram-bot
          docker compose --env-file .env.server -f "$COMPOSE_FILE" up -d --remove-orphans postgres redis rabbitmq backend celery-worker frontend telegram-bot nginx prometheus
          docker compose --env-file .env.server -f "$COMPOSE_FILE" exec -T backend alembic upgrade head

          DEPLOY_SCRIPT
