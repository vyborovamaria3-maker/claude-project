name: solana-launcher-deploy

on:
  push:
    branches:
      - main
    paths:
      - "solana-launcher/**"
      - ".github/workflows/solana-launcher-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-launcher-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -se' <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail

          PROJECT_DIR="/var/www/claude-project"
          APP_DIR="$PROJECT_DIR/solana-launcher"
          COMPOSE_FILE="$PROJECT_DIR/solana-launcher/docker-compose.yml"

          # The existing server checkout has root-owned .git objects. Refresh
          # through a temporary public clone instead of writing that metadata.
          STAGING_DIR="$(mktemp -d /tmp/claude-project-deploy.XXXXXX)"
          trap 'rm -rf "$STAGING_DIR"' EXIT
          REMOTE_URL="$(git -C "$PROJECT_DIR" remote get-url origin)"
          git clone --depth 1 --branch main "$REMOTE_URL" "$STAGING_DIR/repo"
          (cd "$STAGING_DIR/repo" && tar \
            --exclude='./.git' \
            --exclude='./.env*' \
            --exclude='./backend/.env' \
            --exclude='./data' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            -cf - .) | (cd "$PROJECT_DIR" && tar -xf -)

          cd "$APP_DIR"
          # Build one image at a time: the VPS has limited RAM and Docker
          # otherwise starts several npm/pip compilers concurrently (exit 137).
          docker compose --env-file .env.server -f "$COMPOSE_FILE" build backend
          docker compose --env-file .env.server -f "$COMPOSE_FILE" build celery-worker
          docker compose --env-file .env.server -f "$COMPOSE_FILE" build frontend
          docker compose --env-file .env.server -f "$COMPOSE_FILE" build telegram-bot
          docker compose --env-file .env.server -f "$COMPOSE_FILE" up -d --remove-orphans postgres redis rabbitmq backend celery-worker frontend telegram-bot nginx prometheus
          docker compose --env-file .env.server -f "$COMPOSE_FILE" exec -T backend alembic upgrade head

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/ >/dev/null \
              && curl -fsS http://127.0.0.1/miniapp >/dev/null \
              && curl -fsS http://127.0.0.1/fastapi/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose --env-file .env.server -f "$COMPOSE_FILE" ps
              exit 1
            fi
            sleep 4
          done

          docker compose --env-file .env.server -f "$COMPOSE_FILE" ps --status running --services | grep -Fx frontend
          docker compose --env-file .env.server -f "$COMPOSE_FILE" ps --status running --services | grep -Fx telegram-bot
          docker compose --env-file .env.server -f "$COMPOSE_FILE" ps --status running --services | grep -Fx nginx

          DEPLOY_SCRIPT
