name: Memecoin Intelligence CI

on:
  pull_request:
    paths:
      - "memecoin-intelligence/**"
      - ".github/workflows/memecoin-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "memecoin-intelligence/**"
      - ".github/workflows/memecoin-intelligence.yml"

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER.
jobs:
  validate:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: memecoin-intelligence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Syntax and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_ADMIN_API_KEY: ci-admin-key
        run: docker compose -f docker-compose.production.yml config >/dev/null

  security:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: memecoin-intelligence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Install dependencies for audit
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
