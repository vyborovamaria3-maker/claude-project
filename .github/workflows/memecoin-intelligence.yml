name: Memecoin Intelligence CI

on:
  pull_request:
    paths:
      - "memecoin-intelligence/**"
      - ".github/workflows/memecoin-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "memecoin-intelligence/**"
      - ".github/workflows/memecoin-intelligence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memecoin-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Syntax and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_ADMIN_API_KEY: ci-admin-key
        run: docker compose -f docker-compose.production.yml config >/dev/null

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memecoin-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies for audit
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
