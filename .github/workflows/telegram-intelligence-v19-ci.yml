name: Telegram Intelligence v19 CI

on:
  pull_request:
    paths:
      - "solana-launcher/backend/**"
      - "solana-launcher/app/miniapp/**"
      - "solana-launcher/app/api/miniapp/**"
      - "solana-launcher/lib/telegram/**"
      - "solana-launcher/telegram-bot/**"
      - "solana-launcher/app/telegram-intelligence/**"
      - "solana-launcher/app/api/tginvite/**"
      - "solana-launcher/components/tginvite/**"
      - "solana-launcher/lib/tginvite-*.ts"
      - "solana-launcher/lib/routeAuth.ts"
      - "solana-launcher/components/SidebarNav.tsx"
      - "solana-launcher/lib/siteDesign.ts"
      - "solana-launcher/docker-compose.production.yml"
      - "solana-launcher/scripts/deploy-production.sh"
      - "solana-launcher/scripts/healthcheck-production.sh"
      - ".github/workflows/telegram-intelligence-v19-ci.yml"
  push:
    branches:
      - agent/telegram-intelligence-v19
  workflow_dispatch:

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
jobs:
  backend:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    env:
      SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
    defaults:
      run:
        working-directory: solana-launcher/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Check Alembic heads
        run: |
          heads="$(alembic heads | grep -c '(head)')"
          test "$heads" -eq 1
          alembic heads
      - name: Full backend test suite
        run: pytest -q

  frontend:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install frontend
        run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: TGInvite unit tests
        run: npx vitest run --environment node lib/tginvite-storage.test.ts lib/tginvite-invite-policy.test.ts lib/tginvite-invite-route.test.ts lib/tginvite-telegram-client.test.ts lib/tginvite-vault-client.test.ts lib/tginvite-jobs-route.test.ts lib/tginvite-invite-transport.test.ts lib/tginvite-history-export.test.ts lib/tginvite-mtproto.test.ts lib/tginvite-auth.test.ts lib/tginvite-encryption.test.ts lib/tginvite-filter.test.ts lib/tginvite-job-queue.test.ts lib/tginvite-rate-limiter.test.ts lib/tginvite-optin.test.ts lib/tginvite-dashboard-data.test.ts lib/tginvite-monitor-data.test.ts

  compose:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create CI env files
        run: |
          : > backend.env
          : > .env.server
      - name: Validate production Compose
        env:
          IMAGE_TAG: test
          POSTGRES_PASSWORD: test-postgres
          RABBITMQ_PASSWORD: test-rabbit
          SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
          KOL_INTERNAL_KEY: ci-kol-internal-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          SUBSCRIPTION_INTERNAL_KEY: ci-subscription-internal-abcdefghijklmnopqrstuvwxyz
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_WEBHOOK_URL: https://example.invalid/api/telegram/webhook
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
        run: docker compose -f docker-compose.production.yml config >/dev/null
