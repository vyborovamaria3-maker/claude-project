name: Landing target deploy monitor

on:
  workflow_run:
    workflows: ["Landing direct production target"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record direct landing deployment result
        env:
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deployment
          {
            echo "result=$RESULT"
            echo "run_id=$RUN_ID"
            echo "sha=$HEAD_SHA"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment/landing-direct-target.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/landing-direct-target.txt
          git commit -m "Record direct landing production result: $RESULT" || exit 0
          git push origin HEAD:main
