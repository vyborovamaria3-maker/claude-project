name: POTAPoff production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "SERVER_SSH_KNOWN_HOSTS does not contain SERVER_HOST" >&2; exit 1; }

      - name: Upload deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST")
          SCP=(scp -i ~/.ssh/deploy_key -P "$SERVER_PORT")

          "${SSH[@]}" \
            'mkdir -p /opt/potapoff-deploy/scripts /opt/potapoff-deploy/nginx /opt/potapoff-deploy/prometheus /opt/potapoff-deploy/data'

          "${SCP[@]}" \
            solana-launcher/docker-compose.production.yml \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/docker-compose.production.yml"

          "${SCP[@]}" \
            solana-launcher/scripts/backup-production.sh \
            solana-launcher/scripts/healthcheck-production.sh \
            solana-launcher/scripts/deploy-production.sh \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/scripts/"

          "${SCP[@]}" \
            solana-launcher/nginx/nginx.conf \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/nginx/nginx.conf"

          local_prometheus_sha="$(sha256sum solana-launcher/prometheus/prometheus.yml | cut -d ' ' -f1)"
          remote_prometheus_sha="$(
            "${SSH[@]}" \
              "sha256sum /opt/potapoff-deploy/prometheus/prometheus.yml 2>/dev/null | cut -d ' ' -f1" \
              || true
          )"

          if [[ "$local_prometheus_sha" == "$remote_prometheus_sha" && -n "$remote_prometheus_sha" ]]; then
            echo "PROMETHEUS_CONFIG_UNCHANGED"
          else
            prometheus_tmp="/tmp/potapoff-prometheus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yml"
            "${SCP[@]}" \
              solana-launcher/prometheus/prometheus.yml \
              "$SERVER_USER@$SERVER_HOST:$prometheus_tmp"

            "${SSH[@]}" "set -euo pipefail
              src='$prometheus_tmp'
              dst='/opt/potapoff-deploy/prometheus/prometheus.yml'
              if install -m 0644 \"\$src\" \"\$dst\" 2>/dev/null; then
                rm -f \"\$src\"
                echo PROMETHEUS_CONFIG_INSTALLED
              elif command -v sudo >/dev/null 2>&1 && sudo -n install -m 0644 \"\$src\" \"\$dst\"; then
                rm -f \"\$src\"
                echo PROMETHEUS_CONFIG_INSTALLED_WITH_SUDO
              else
                echo 'Unable to update Prometheus config: target is not writable and passwordless sudo is unavailable' >&2
                ls -ld /opt/potapoff-deploy/prometheus /opt/potapoff-deploy/prometheus/prometheus.yml >&2 || true
                rm -f \"\$src\"
                exit 1
              fi"
          fi

          "${SSH[@]}" \
            'chmod 700 /opt/potapoff-deploy/scripts/*.sh &&
             chmod 755 /opt/potapoff-deploy/nginx &&
             chmod 644 /opt/potapoff-deploy/nginx/nginx.conf &&
              test -r /opt/potapoff-deploy/prometheus/prometheus.yml'

      - name: Upload admin Control Center sources
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST")
          SCP=(scp -i ~/.ssh/deploy_key -P "$SERVER_PORT")
          archive="/tmp/potapoff-admin-${GITHUB_SHA}.tar.gz"

          tar \
            --exclude='admin-site/.env' \
            --exclude='admin-site/.env.*' \
            --exclude='admin-site/sources.json' \
            --exclude='admin-site/logs.json' \
            --exclude='admin-site/__pycache__' \
            --exclude='admin-site/**/__pycache__' \
            -czf "$archive" admin-site

          "${SSH[@]}" 'mkdir -p /opt/claude-project'
          "${SCP[@]}" "$archive" "$SERVER_USER@$SERVER_HOST:$archive"
          "${SSH[@]}" "tar -xzf '$archive' -C /opt/claude-project && rm -f '$archive'"
          rm -f "$archive"

      - name: Login server to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy with backup and rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST")
          "${SSH[@]}" \
            "cd /opt/potapoff-deploy && bash scripts/deploy-production.sh '${GITHUB_SHA}'"
