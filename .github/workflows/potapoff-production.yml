name: POTAPoff production (legacy)

# Production is deployed directly on the server with
# solana-launcher/scripts/deploy-production-local.sh.
# Keep this workflow manual-only so pushes to main do not queue on an
# unavailable self-hosted GitHub Actions runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-deploy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Production deployment moved to server
        run: |
          echo "Automatic GitHub Actions production deployment is disabled."
          echo "Run /opt/claude-project/solana-launcher/scripts/deploy-production-local.sh on the production server."
