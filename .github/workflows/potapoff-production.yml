name: POTAPoff production

on:
  push:
    branches: [main]
    paths:
      - "solana-launcher/**"
      - ".github/workflows/potapoff-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: potapoff-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-project

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: solana-launcher/backend
            dockerfile: solana-launcher/backend/Dockerfile
          - service: frontend
            context: solana-launcher
            dockerfile: solana-launcher/Dockerfile.frontend.prod

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker build files
        run: |
          set -euo pipefail
          test -f solana-launcher/backend/Dockerfile
          test -f solana-launcher/Dockerfile.frontend.prod
          echo "DOCKERFILES_OK"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/${{ matrix.context }}
          file: ${{ github.workspace }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://potapoff.fun
            NEXT_PUBLIC_FRONTEND_URL=https://potapoff.fun
            NEXT_PUBLIC_BACKEND_URL=https://potapoff.fun/fastapi
            NEXT_PUBLIC_TELEGRAM_BOT_URL=https://t.me/Soft777bot
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST")
          SCP=(scp -i ~/.ssh/deploy_key -P "$SERVER_PORT")

          "${SSH[@]}" \
            'mkdir -p /opt/potapoff-deploy/scripts /opt/potapoff-deploy/nginx /opt/potapoff-deploy/prometheus /opt/potapoff-deploy/data'

          "${SCP[@]}" \
            solana-launcher/docker-compose.production.yml \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/docker-compose.production.yml"

          "${SCP[@]}" \
            solana-launcher/scripts/backup-production.sh \
            solana-launcher/scripts/healthcheck-production.sh \
            solana-launcher/scripts/deploy-production.sh \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/scripts/"

          "${SCP[@]}" \
            solana-launcher/nginx/nginx.conf \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/nginx/nginx.conf"

          local_prometheus_sha="$(sha256sum solana-launcher/prometheus/prometheus.yml | awk '{print $1}')"
          remote_prometheus_sha="$(
            "${SSH[@]}" \
              "sha256sum /opt/potapoff-deploy/prometheus/prometheus.yml 2>/dev/null | awk '{print \\$1}'" \
              || true
          )"

          if [[ "$local_prometheus_sha" == "$remote_prometheus_sha" && -n "$remote_prometheus_sha" ]]; then
            echo "PROMETHEUS_CONFIG_UNCHANGED"
          else
            prometheus_tmp="/tmp/potapoff-prometheus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yml"
            "${SCP[@]}" \
              solana-launcher/prometheus/prometheus.yml \
              "$SERVER_USER@$SERVER_HOST:$prometheus_tmp"

            "${SSH[@]}" "set -euo pipefail
              src='$prometheus_tmp'
              dst='/opt/potapoff-deploy/prometheus/prometheus.yml'
              if install -m 0644 \"\$src\" \"\$dst\" 2>/dev/null; then
                rm -f \"\$src\"
                echo PROMETHEUS_CONFIG_INSTALLED
              elif command -v sudo >/dev/null 2>&1 && sudo -n install -m 0644 \"\$src\" \"\$dst\"; then
                rm -f \"\$src\"
                echo PROMETHEUS_CONFIG_INSTALLED_WITH_SUDO
              else
                echo 'Unable to update Prometheus config: target is not writable and passwordless sudo is unavailable' >&2
                ls -ld /opt/potapoff-deploy/prometheus /opt/potapoff-deploy/prometheus/prometheus.yml >&2 || true
                rm -f \"\$src\"
                exit 1
              fi"
          fi

          "${SSH[@]}" \
            'chmod 700 /opt/potapoff-deploy/scripts/*.sh &&
             chmod 755 /opt/potapoff-deploy/nginx /opt/potapoff-deploy/prometheus &&
             chmod 644 /opt/potapoff-deploy/nginx/nginx.conf &&
             chmod 644 /opt/potapoff-deploy/prometheus/prometheus.yml'

      - name: Login server to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy with backup and rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "/opt/potapoff-deploy/scripts/deploy-production.sh '${GITHUB_SHA}'"
