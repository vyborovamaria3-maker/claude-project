name: POTAPoff production

on:
  push:
    branches: [main]
    paths:
      - "solana-launcher/**"
      - ".github/workflows/potapoff-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: potapoff-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-project

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./solana-launcher/backend
            dockerfile: Dockerfile
          - service: frontend
            context: ./solana-launcher
            dockerfile: Dockerfile.frontend.prod
          - service: telegram-bot
            context: ./solana-launcher
            dockerfile: Dockerfile.telegram-bot

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://potapoff.fun
            NEXT_PUBLIC_FRONTEND_URL=https://potapoff.fun
            NEXT_PUBLIC_BACKEND_URL=https://potapoff.fun/fastapi
            NEXT_PUBLIC_TELEGRAM_BOT_URL=https://t.me/Soft777bot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'mkdir -p /opt/potapoff-deploy/scripts /opt/potapoff-deploy/nginx /opt/potapoff-deploy/prometheus /opt/potapoff-deploy/data'

          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            solana-launcher/docker-compose.production.yml \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/docker-compose.production.yml"

          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            solana-launcher/scripts/backup-production.sh \
            solana-launcher/scripts/healthcheck-production.sh \
            solana-launcher/scripts/deploy-production.sh \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/scripts/"

          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            solana-launcher/nginx/nginx.conf \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/nginx/nginx.conf"

          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            solana-launcher/prometheus/prometheus.yml \
            "$SERVER_USER@$SERVER_HOST:/opt/potapoff-deploy/prometheus/prometheus.yml"

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'chmod 700 /opt/potapoff-deploy/scripts/*.sh'

      - name: Login server to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy with backup and rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "/opt/potapoff-deploy/scripts/deploy-production.sh '${GITHUB_SHA}'"
