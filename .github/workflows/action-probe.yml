name: Action probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/action-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record Actions availability
        run: |
          set -euo pipefail
          mkdir -p .deployment
          printf 'actions=ok\nsha=%s\n' "$GITHUB_SHA" > .deployment/action-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/action-probe.txt
          git commit -m "Record GitHub Actions probe"
          git push origin HEAD:main
