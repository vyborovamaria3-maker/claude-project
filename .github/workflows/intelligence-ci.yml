name: Intelligence CI

on:
  pull_request:
    paths:
      - "intelligence/**"
      - "admin-site/app/intelligence_view.py"
      - "admin-site/app/intelligence_view_factory.py"
      - "admin-site/app/main_admin.py"
      - "admin-site/app/config.py"
      - "admin-site/tests/test_intelligence_*.py"
      - "admin-site/docker-compose.yml"
      - "admin-site/requirements.txt"
      - ".github/workflows/intelligence-ci.yml"

permissions:
  contents: read

jobs:
  intelligence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install intelligence and admin integration dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r intelligence/requirements.txt \
            -r admin-site/requirements.txt

      - name: Compile intelligence and admin integration
        run: |
          python -m compileall -q intelligence
          python -m py_compile \
            admin-site/app/intelligence_view.py \
            admin-site/app/intelligence_view_factory.py \
            admin-site/app/main_admin.py \
            admin-site/app/config.py \
            admin-site/tests/test_intelligence_view.py \
            admin-site/tests/test_intelligence_view_factory.py

      - name: Run intelligence unit tests
        run: python -m unittest discover -s intelligence/tests -p "test_*.py" -v

      - name: Run admin intelligence integration tests
        env:
          PYTHONPATH: admin-site
        run: python -m unittest discover -s admin-site/tests -p "test_intelligence_*.py" -v

      - name: Reject credential files
        shell: bash
        run: |
          set -euo pipefail
          if find intelligence -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*cookies*' \) -print -quit | grep -q .; then
            echo "Credential-like file found under intelligence/"
            exit 1
          fi
