name: Intelligence CI

on:
  pull_request:
    paths:
      - "intelligence/**"
      - "admin-site/app/intelligence_view.py"
      - "admin-site/app/intelligence_view_factory.py"
      - "admin-site/app/main_admin.py"
      - "admin-site/app/config.py"
      - "admin-site/tests/test_intelligence_*.py"
      - "admin-site/docker-compose.yml"
      - "admin-site/.env.example"
      - "admin-site/.env.intelligence.example"
      - "admin-site/requirements.txt"
      - ".gitignore"
      - ".github/workflows/intelligence-ci.yml"

permissions:
  contents: read

jobs:
  intelligence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intelligence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install intelligence and admin integration dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r intelligence/requirements.txt \
            -r admin-site/requirements.txt

      - name: Compile intelligence and admin integration
        run: |
          python -m compileall -q intelligence
          python -m py_compile \
            admin-site/app/intelligence_view.py \
            admin-site/app/intelligence_view_factory.py \
            admin-site/app/main_admin.py \
            admin-site/app/config.py \
            admin-site/tests/test_intelligence_view.py \
            admin-site/tests/test_intelligence_view_factory.py

      - name: Run intelligence unit tests
        run: python -m unittest discover -s intelligence/tests -p "test_*.py" -v

      - name: Run deterministic scoring backtest
        run: python -m intelligence backtest

      - name: Run admin intelligence integration tests
        env:
          PYTHONPATH: admin-site
        run: python -m unittest discover -s admin-site/tests -p "test_intelligence_*.py" -v

      - name: Initialize disposable PostgreSQL and read-only admin role
        env:
          POTAPOFF_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/intelligence
        run: |
          python - <<'PY'
          import os
          import psycopg
          from intelligence.storage.postgres_schema import initialize_postgres_schema

          dsn = os.environ["POTAPOFF_TEST_POSTGRES_DSN"]
          initialize_postgres_schema(dsn)
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute("DROP ROLE IF EXISTS intelligence_readonly")
              connection.execute("CREATE ROLE intelligence_readonly LOGIN PASSWORD 'readonly'")
              connection.execute("GRANT CONNECT ON DATABASE intelligence TO intelligence_readonly")
              connection.execute("GRANT USAGE ON SCHEMA public TO intelligence_readonly")
              connection.execute("GRANT SELECT ON intelligence_documents, intelligence_jobs TO intelligence_readonly")
          PY

      - name: Run live PostgreSQL intelligence integration tests
        env:
          POTAPOFF_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/intelligence
          POTAPOFF_TEST_POSTGRES_READONLY_DSN: postgresql://intelligence_readonly:readonly@127.0.0.1:5432/intelligence
        run: python -m unittest intelligence.tests.test_postgres_integration -v

      - name: Prepare Compose smoke configuration
        run: |
          cp admin-site/.env.example admin-site/.env
          cp admin-site/.env.intelligence.example admin-site/.env.intelligence
          cp admin-site/sources.example.json admin-site/sources.json
          cp admin-site/logs.example.json admin-site/logs.json

      - name: Validate secret separation templates
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^POTAPOFF_INTELLIGENCE_POSTGRES_DSN=' admin-site/.env.example; then
            echo "Worker write DSN must not exist in admin .env template" >&2
            exit 1
          fi
          grep -q '^POTAPOFF_INTELLIGENCE_POSTGRES_DSN=' admin-site/.env.intelligence.example
          grep -q '^ADMIN_INTELLIGENCE_POSTGRES_DSN=' admin-site/.env.example

      - name: Validate Docker Compose and rendered secret boundary
        run: |
          docker compose -f admin-site/docker-compose.yml config --quiet
          docker compose -f admin-site/docker-compose.yml config --format json > /tmp/potapoff-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/potapoff-compose.json').read_text())
          services = config['services']
          admin_env = services['admin'].get('environment', {})
          worker_env = services['intelligence-worker'].get('environment', {})
          assert 'POTAPOFF_INTELLIGENCE_POSTGRES_DSN' not in admin_env, admin_env.keys()
          assert 'ADMIN_INTELLIGENCE_POSTGRES_DSN' not in worker_env, worker_env.keys()
          assert 'POTAPOFF_INTELLIGENCE_POSTGRES_DSN' in worker_env
          assert 'ADMIN_INTELLIGENCE_POSTGRES_DSN' in admin_env
          PY

      - name: Build intelligence worker image
        run: docker build --pull -t potapoff-intelligence:${{ github.sha }} intelligence

      - name: Smoke intelligence worker image
        run: |
          set -euo pipefail
          test "$(docker image inspect potapoff-intelligence:${{ github.sha }} --format '{{.Config.User}}')" = "intelligence"
          docker run --rm --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            potapoff-intelligence:${{ github.sha }} python -m intelligence --help >/dev/null
          docker run --rm --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            potapoff-intelligence:${{ github.sha }} python -m intelligence backtest >/dev/null
          docker run --rm --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            potapoff-intelligence:${{ github.sha }} yt-dlp --version
          docker run --rm --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            potapoff-intelligence:${{ github.sha }} deno --version

      - name: Scan intelligence image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: potapoff-intelligence:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Reject credential files
        shell: bash
        run: |
          set -euo pipefail
          if find intelligence -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*cookies*' \) -print -quit | grep -q .; then
            echo "Credential-like file found under intelligence/"
            exit 1
          fi
