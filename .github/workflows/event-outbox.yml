name: Transactional outbox adapters

on:
  pull_request:
    paths:
      - "packages/event-outbox/**"
      - ".github/workflows/event-outbox.yml"
  push:
    branches: [main]
    paths:
      - "packages/event-outbox/**"
      - ".github/workflows/event-outbox.yml"

jobs:
  outbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: outbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d outbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTBOX_TEST_PG_URL: postgresql://test:testpass@127.0.0.1:5432/outbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix packages/event-outbox --no-package-lock --no-audit
      - run: npm --prefix packages/event-outbox run check
