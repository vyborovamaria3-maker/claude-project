name: Security Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "solana-launcher/**"
      - "solana-subscription-service/**"
      - "telegram-miniapp/backend-new/**"
      - "telegram-miniapp/bot/**"
      - "security/**"
      - ".github/workflows/security-gates.yml"
      - ".github/workflows/potapoff-production.yml"
  workflow_dispatch:

concurrency:
  group: security-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan current tracked files without printing secret values
        run: python3 security/audit/secret-scan.py --mode current
      - name: Scan newly introduced PR lines without printing secret values
        if: github.event_name == 'pull_request'
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 security/audit/secret-scan.py --mode diff --base "$AUDIT_BASE_SHA" --head "$AUDIT_HEAD_SHA"
      - name: Scan full git history for secrets (pre-merge safety net)
        if: github.event_name == 'pull_request'
        run: python3 security/audit/secret-scan.py --mode history

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Security source regression
        run: node scripts/security-regression.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production dependency audit
        env:
          ALLOW_BIGINT_BUFFER_UNTIL: "2026-10-01"
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/frontend-npm-audit.json" || true
          node ../security/audit/npm-audit-policy.mjs "$RUNNER_TEMP/frontend-npm-audit.json"

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
      ENVIRONMENT: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: solana-launcher/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend and audit tool
        run: |
          python -m pip install --upgrade "setuptools>=83"
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Auth, entitlement and production-secret regression
        run: >-
          pytest -q
          tests/test_auth.py
          tests/test_entitlement.py
          tests/test_production_admin_config.py
          tests/test_auth_response_security.py
          tests/test_admin_bootstrap_security.py
          tests/test_runtime_security_defaults.py
      - name: Python dependency audit
        run: pip-audit

  subscription-service-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: solana-subscription-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-subscription-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: API typecheck
        run: npm run typecheck -w @solsub/api
      - name: API security regressions
        run: npm run test -w @solsub/api
      - name: Production dependency audit
        env:
          ALLOW_BIGINT_BUFFER_UNTIL: "2026-10-01"
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/subscription-npm-audit.json" || true
          node ../security/audit/npm-audit-policy.mjs "$RUNNER_TEMP/subscription-npm-audit.json"

  legacy-miniapp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telegram-miniapp/backend-new
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: telegram-miniapp/backend-new/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: TypeScript build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
