name: Security lockfile sync

on:
  pull_request:
    branches: [main]
    paths:
      - "solana-launcher/package.json"
      - "solana-launcher/scripts/xlsx-safe-package/**"
      - ".github/workflows/security-lock-sync.yml"

permissions:
  contents: write

concurrency:
  group: security-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/security-audit-remediation-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone remediation branch without third-party actions
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GITHUB_TOKEN"
          git clone --depth 1 --branch agent/security-audit-remediation-v2 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git status --short

      - name: Regenerate lock metadata without lifecycle scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd repo/solana-launcher
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Verify clean install resolves local safe XLSX package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd repo/solana-launcher
          npm ci --ignore-scripts --legacy-peer-deps
          node scripts/xlsx-safe-package/test.mjs
          node - <<'NODE'
          const pkg = require('./node_modules/xlsx/package.json');
          if (pkg.version !== '0.0.0-potapoff-safe') {
            throw new Error(`Unexpected xlsx package: ${pkg.version}`);
          }
          console.log('SAFE_XLSX_PACKAGE_OK');
          NODE
          if grep -q '"version": "0.18.5"' package-lock.json; then
            echo "Legacy SheetJS 0.18.5 still present in lockfile" >&2
            exit 1
          fi

      - name: Commit synchronized package-lock
        shell: bash
        run: |
          set -Eeuo pipefail
          cd repo
          if git diff --quiet -- solana-launcher/package-lock.json; then
            echo "LOCKFILE_ALREADY_SYNCED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solana-launcher/package-lock.json
          git commit -m "security: sync lockfile for safe xlsx reader"
          git push origin HEAD:agent/security-audit-remediation-v2
