name: POTAPoff predeploy gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "solana-launcher/**"
      - "admin-site/**"
      - "memecoin-intelligence/**"
      - ".github/workflows/potapoff-predeploy-gate.yml"
      - ".github/workflows/potapoff-production.yml"

permissions:
  contents: read

concurrency:
  group: potapoff-predeploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-migrations:
    name: Backend, Twitter tests and Alembic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: potapoff_ci
          POSTGRES_USER: potapoff
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U potapoff -d potapoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: 9f4d8c7261b5e0a39c4f7d2816e5b3a09f4d8c7261b5e0a39c4f7d2816e5b3a0
      DATABASE_URL: postgresql+asyncpg://potapoff:ci-postgres-password@127.0.0.1:55433/potapoff_ci
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend with test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e 'solana-launcher/backend[dev]'
      - name: Validate Python syntax
        working-directory: solana-launcher/backend
        run: python -m compileall -q app tests
      - name: Apply complete migration graph on PostgreSQL
        working-directory: solana-launcher/backend
        run: |
          set -Eeuo pipefail
          alembic upgrade heads
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          alembic current | grep -Fq '0021_twitter_run_singleton'
      - name: Run Twitter and migration regression tests
        working-directory: solana-launcher/backend
        run: pytest -q tests/test_twitter*.py tests/test_alembic_revision_ids.py

  frontend:
    name: Frontend typecheck, regressions and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Security regression
        run: npm run security:test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  admin-control-center:
    name: Control Center regression and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: potapoff_admin_test
          POSTGRES_USER: potapoff_admin
          POSTGRES_PASSWORD: ci-admin-state-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U potapoff_admin -d potapoff_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_STATE_TEST_DSN: postgresql://potapoff_admin:ci-admin-state-password@127.0.0.1:55432/potapoff_admin_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin-site/requirements.txt
      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install Control Center dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r admin-site/requirements.txt
      - name: Run deep Control Center regression suite
        run: bash admin-site/scripts/test-deep.sh
      - name: Validate Control Center Compose
        run: |
          set -Eeuo pipefail
          cp admin-site/.env.example admin-site/.env
          sed -i 's/^ADMIN_STATE_DB_PASSWORD=.*/ADMIN_STATE_DB_PASSWORD=ci-compose-password/' admin-site/.env
          cp admin-site/.env.intelligence.example admin-site/.env.intelligence
          cp admin-site/sources.example.json admin-site/sources.json
          cp admin-site/logs.example.json admin-site/logs.json
          docker compose -f admin-site/docker-compose.yml config --quiet

  intelligence:
    name: Qwen/intelligence typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: memecoin-intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run regression suite including Qwen full-intelligence smoke
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate intelligence production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_ADMIN_API_KEY: ci-admin-key
        run: docker compose -f docker-compose.production.yml config >/dev/null

  production-static:
    name: Production Compose, Dockerfile and deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate deployment shell syntax
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "BASH_N $file"
            bash -n "$file"
          done < <(find solana-launcher/scripts -type f -name '*.sh' -print0)
      - name: Prepare non-secret Compose validation environment
        run: |
          cat > solana-launcher/.env.server <<'EOF'
          IMAGE_TAG=predeploy-ci
          POSTGRES_PASSWORD=ci-postgres-password
          RABBITMQ_PASSWORD=ci-rabbitmq-password
          SECRET_KEY=2a9c7e4f6b8d1a3c5e7f9b2d4a6c8e1f2a9c7e4f6b8d1a3c5e7f9b2d4a6c8e1f
          BACKEND_API_KEY=3b8d6f4a2c9e7b5d1f3a6c8e2b4d7f9a3b8d6f4a2c9e7b5d1f3a6c8e2b4d7f9a
          SUBSCRIPTION_INTERNAL_KEY=4c7e5a3d9b1f8c6e2a4d7b9f3c5e8a1d4c7e5a3d9b1f8c6e2a4d7b9f3c5e8a1d
          SUBSCRIPTION_ADMIN_KEY=5d6f4b2e8a3c7d1f9b5e2a4c6d8f1b3e5d6f4b2e8a3c7d1f9b5e2a4c6d8f1b3e
          TELEGRAM_BOT_TOKEN=123456789:CI_ONLY_FAKE_BOT_TOKEN_FOR_COMPOSE_VALIDATION
          TELEGRAM_WEBHOOK_URL=https://example.invalid/api/telegram/webhook
          TELEGRAM_WEBHOOK_SECRET=6e5a3c1f7b9d4e2a8c6f1b3d5e7a9c2f6e5a3c1f7b9d4e2a8c6f1b3d5e7a9c2f
          EOF
          cat > solana-launcher/backend.env <<'EOF'
          ADMIN_PASSWORD=ci-only-strong-admin-password
          ADMIN_SESSION_SECRET=7f4b2d9a6e3c8f1b5d7a2e4c9f6b3d1a7f4b2d9a6e3c8f1b5d7a2e4c9f6b3d1a
          SUBSCRIPTION_PASSWORD_ENCRYPTION_KEY=8a3d7f1b5e9c2a6d4f8b1c3e7a5d9f2b8a3d7f1b5e9c2a6d4f8b1c3e7a5d9f2b
          TWITTER_CRAWLER_ADMIN_KEY=9b2e6a4d8f1c5b3e7a9d2f4c6b8e1a3d9b2e6a4d8f1c5b3e7a9d2f4c6b8e1a3d
          EOF
      - name: Validate production Compose
        working-directory: solana-launcher
        run: docker compose --env-file .env.server -f docker-compose.production.yml config --quiet
      - name: Build backend image definition
        run: docker build --pull -t potapoff-backend-predeploy:${{ github.sha }} solana-launcher/backend
