name: POTAPoff predeploy gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "solana-launcher/**"
      - "admin-site/**"
      - "memecoin-intelligence/**"
      - "solana-subscription-service/**"
      - ".github/scripts/test-readonly-source-roles.sh"
      - ".github/workflows/potapoff-predeploy-gate.yml"
      - ".github/workflows/potapoff-production.yml"
      - ".github/workflows/potapoff-release-images.yml"

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
concurrency:
  group: potapoff-predeploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-migrations:
    name: Backend, Twitter tests and Alembic
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: potapoff_ci
          POSTGRES_USER: potapoff
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U potapoff -d potapoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-signing-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
      DATABASE_URL: postgresql+asyncpg://potapoff:ci-postgres-password@127.0.0.1:55433/potapoff_ci
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend with test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e 'solana-launcher/backend[dev]'
      - name: Validate Python syntax
        working-directory: solana-launcher/backend
        run: python -m compileall -q app tests
      - name: Apply complete migration graph on PostgreSQL
        working-directory: solana-launcher/backend
        run: |
          set -Eeuo pipefail
          alembic upgrade heads
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          expected_head="$(alembic heads | awk '{print $1}')"
          current_head="$(alembic current | awk '/^[0-9][0-9]/ {print $1}')"
          test -n "$expected_head"
          test "$current_head" = "$expected_head"
      - name: Execute actual Alembic graph as isolated non-superuser migration role
        working-directory: solana-launcher/backend
        run: |
          set -Eeuo pipefail
          bash -n ../../.github/scripts/test-backend-alembic-restricted.sh
          bash ../../.github/scripts/test-backend-alembic-restricted.sh
      - name: Run Twitter, KOL and migration regression tests
        working-directory: solana-launcher/backend
        run: pytest -q tests/test_twitter*.py tests/test_kol*.py tests/test_alembic_revision_ids.py

  frontend:
    name: Frontend typecheck, regressions and build
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Security regression
        run: npm run security:test
      - name: KOL regression
        run: npm run kols:test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  admin-control-center:
    name: Control Center regression and Compose
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: potapoff_admin_test
          POSTGRES_USER: potapoff_admin
          POSTGRES_PASSWORD: ci-admin-state-password
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U potapoff_admin -d potapoff_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_STATE_TEST_DSN: postgresql://potapoff_admin:ci-admin-state-password@127.0.0.1:55434/potapoff_admin_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin-site/requirements.txt
      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install Control Center dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r admin-site/requirements.txt
      - name: Run deep Control Center regression suite
        run: bash admin-site/scripts/test-deep.sh
      - name: Prove Admin PostgreSQL 17 preprovisioned schema supports DML-only runtime
        env:
          ADMIN_PG_SCHEMA_MODE: legacy
        run: python admin-site/scripts/test_postgres_preprovisioned_roles.py
      - name: Validate Control Center Compose
        run: |
          set -Eeuo pipefail
          cp admin-site/.env.example admin-site/.env
          sed -i 's/^ADMIN_STATE_DB_PASSWORD=.*/ADMIN_STATE_DB_PASSWORD=ci-compose-password/' admin-site/.env
          sed -i 's/^ADMIN_STATE_APP_PASSWORD=.*/ADMIN_STATE_APP_PASSWORD=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/' admin-site/.env
          sed -i 's/^ADMIN_STATE_MIGRATOR_PASSWORD=.*/ADMIN_STATE_MIGRATOR_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb/' admin-site/.env
          sed -i 's/^ADMIN_STATE_BACKUP_PASSWORD=.*/ADMIN_STATE_BACKUP_PASSWORD=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc/' admin-site/.env
          sed -i 's/^ADMIN_STATE_RUNTIME_PASSWORD=.*/ADMIN_STATE_RUNTIME_PASSWORD=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/' admin-site/.env
          sed -i 's/^SUBSCRIPTION_ADMIN_KEY=.*/SUBSCRIPTION_ADMIN_KEY=ci-subscription-admin-key/' admin-site/.env
          cp admin-site/.env.intelligence.example admin-site/.env.intelligence
          bash admin-site/deploy/refresh-runtime-env.sh
          cp admin-site/sources.example.json admin-site/sources.json
          cp admin-site/logs.example.json admin-site/logs.json
          docker compose -f admin-site/docker-compose.yml config --quiet

  intelligence:
    name: Qwen/intelligence typecheck, tests and build
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: memecoin-intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run regression suite including Qwen full-intelligence smoke
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate intelligence production Compose
        env:
          POSTGRES_USER: memecoin
          POSTGRES_DB: memecoin
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_READONLY_PASSWORD: ci-postgres-readonly-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_ADMIN_API_KEY: ci-admin-key
        run: docker compose -f docker-compose.production.yml config >/dev/null

  production-static:
    name: Production Compose, Dockerfiles and deploy scripts
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate deployment shell syntax
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "BASH_N $file"
            bash -n "$file"
          done < <(find solana-launcher/scripts -type f -name '*.sh' -print0)
      - name: Set up Node for Compose command safety regression
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify Compose down preserves named volumes by default
        run: node --test solana-launcher/scripts/compose-command-safety.test.mjs
      - name: Prepare non-secret Compose validation environment
        run: |
          cat > solana-launcher/.env.server <<'EOF'
          IMAGE_TAG=predeploy-ci
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_APP_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_MIGRATOR_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          POSTGRES_BACKUP_PASSWORD=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          POSTGRES_READONLY_PASSWORD=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          REDIS_PASSWORD=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          RABBITMQ_PASSWORD=ci-rabbitmq-password
          SECRET_KEY=ci-signing-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          BACKEND_API_KEY=ci-backend-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          KOL_INTERNAL_KEY=ci-kol-internal-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          SUBSCRIPTION_INTERNAL_KEY=ci-subscription-internal-abcdefghijklmnopqrstuvwxyz
          SUBSCRIPTION_ADMIN_KEY=ci-subscription-admin-abcdefghijklmnopqrstuvwxyz
          TELEGRAM_BOT_TOKEN=ci-compose-bot-token
          TELEGRAM_WEBHOOK_URL=https://example.invalid/api/telegram/webhook
          TELEGRAM_WEBHOOK_SECRET=ci-webhook-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          EOF
          cat > solana-launcher/backend.env <<'EOF'
          ADMIN_PASSWORD=ci-control-center-credential-abcdefghijk
          ADMIN_SESSION_SECRET=ci-session-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          SUBSCRIPTION_PASSWORD_ENCRYPTION_KEY=ci-encryption-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          TWITTER_CRAWLER_ADMIN_KEY=ci-twitter-admin-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
          EOF
          : > solana-launcher/.env.runtime
      - name: Validate production Compose
        working-directory: solana-launcher
        run: docker compose --env-file .env.server -f docker-compose.production.yml config --quiet
      - name: Validate Subscription and Memecoin production Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > solana-subscription-service/.env <<'EOF'
          POSTGRES_DB=solsub
          POSTGRES_USER=solsub
          POSTGRES_PASSWORD=ci-solsub-bootstrap-password
          POSTGRES_APP_USER=solsub_app
          POSTGRES_APP_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_MIGRATOR_USER=solsub_migrator
          POSTGRES_MIGRATOR_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          POSTGRES_READONLY_PASSWORD=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          REDIS_PASSWORD=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          WEB_ORIGIN=https://subscription.example.invalid
          API_PUBLIC_URL=https://api.subscription.example.invalid
          WEB_PUBLIC_URL=https://subscription.example.invalid
          JWT_ACCESS_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_REFRESH_SECRET=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TELEGRAM_BOT_TOKEN=123456:ci-test-token-placeholder
          TELEGRAM_BOT_USERNAME=ci_subscription_bot
          TELEGRAM_WEBHOOK_SECRET=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          TELEGRAM_WEBAPP_URL=https://subscription.example.invalid
          SOLANA_CLUSTER=devnet
          RPC_ENDPOINT=https://api.devnet.solana.com
          TREASURY_WALLET=11111111111111111111111111111111
          TREASURY_USDC_TOKEN_ACCOUNT=11111111111111111111111111111111
          USDC_MINT=4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
          PAYMENT_CONFIRMATION_COMMITMENT=finalized
          NEXT_PUBLIC_API_URL=https://api.subscription.example.invalid
          NEXT_PUBLIC_WEB_URL=https://subscription.example.invalid
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=ci_subscription_bot
          NEXT_PUBLIC_SOLANA_CLUSTER=devnet
          NEXT_PUBLIC_RPC_ENDPOINT=https://api.devnet.solana.com
          NEXT_PUBLIC_TREASURY_WALLET=11111111111111111111111111111111
          EOF
          docker compose --env-file solana-subscription-service/.env -f solana-subscription-service/docker-compose.prod.yml config --quiet
          cat > memecoin-intelligence/.env <<'EOF'
          POSTGRES_USER=memecoin
          POSTGRES_DB=memecoin
          POSTGRES_PASSWORD=ci-memecoin-bootstrap-password
          POSTGRES_APP_USER=memecoin_app
          POSTGRES_APP_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_MIGRATOR_USER=memecoin_migrator
          POSTGRES_MIGRATOR_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          POSTGRES_READONLY_PASSWORD=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          REDIS_PASSWORD=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          INTERNAL_ADMIN_API_KEY=ci-memecoin-internal-admin-key
          WEB_ORIGIN=https://memecoin.example.invalid
          EOF
          docker compose --env-file memecoin-intelligence/.env -f memecoin-intelligence/docker-compose.production.yml config --quiet
      - name: Exercise PostgreSQL read-only source role provisioners
        run: bash .github/scripts/test-readonly-source-roles.sh
      - name: Build backend production image
        run: docker build --pull -t potapoff-backend-predeploy:${{ github.sha }} solana-launcher/backend
      - name: Verify backend runtime excludes build-only Python tooling
        run: |
          image="potapoff-backend-predeploy:${{ github.sha }}"
          docker run --rm --entrypoint sh "$image" -ec '
            python -c '\''import importlib.metadata as m; blocked={"setuptools","wheel","jaraco.context"}; installed={d.metadata.get("Name","").lower() for d in m.distributions()}; remaining=sorted(blocked & installed); assert not remaining, remaining'\''
            if find /usr/local/lib /usr/lib -type d -name "setuptools-*.dist-info" -print -quit | grep -q . \
              || find /usr/local/lib /usr/lib -type d -name "setuptools-*.egg-info" -print -quit | grep -q .; then
              echo "Unexpected setuptools metadata remains in the runtime image" >&2
              exit 1
            fi
            for package in python3-setuptools python3-pkg-resources; do
              status="$(dpkg-query -W -f='\''${db:Status-Status}'\'' "$package" 2>/dev/null || true)"
              test "$status" != installed
            done
          '
      - name: Scan backend image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: potapoff-backend-predeploy:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - name: Build frontend production image
        run: |
          docker build --pull \
            -f solana-launcher/Dockerfile.frontend.prod \
            --build-arg NEXT_PUBLIC_APP_URL=https://potapoff.fun \
            --build-arg NEXT_PUBLIC_FRONTEND_URL=https://potapoff.fun \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://potapoff.fun/fastapi \
            --build-arg NEXT_PUBLIC_TELEGRAM_BOT_URL=https://t.me/Soft777bot \
            --build-arg NEXT_PUBLIC_BUILD_SHA=predeploy-${{ github.sha }} \
            -t potapoff-frontend-predeploy:${{ github.sha }} \
            solana-launcher
      - name: Scan frontend image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: potapoff-frontend-predeploy:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - name: Build Telegram bot production image
        run: |
          docker build --pull \
            -f solana-launcher/Dockerfile.telegram-bot \
            -t potapoff-telegram-bot-predeploy:${{ github.sha }} \
            solana-launcher
      - name: Scan Telegram bot image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: potapoff-telegram-bot-predeploy:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - name: Verify Telegram bot final image runtime and non-root identity
        run: |
          image="potapoff-telegram-bot-predeploy:${{ github.sha }}"
          runtime_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
          test "$runtime_user" = "node"
          runtime_uid="$(docker run --rm --entrypoint id "$image" -u)"
          test "$runtime_uid" != "0"
          runtime_major="$(docker run --rm --entrypoint node "$image" -p 'Number(process.versions.node.split(".")[0])')"
          echo "Telegram bot image Node.js major: ${runtime_major}"
          test "${runtime_major}" -ge 22
          for build_tool in python3 make g++; do
            if docker run --rm --entrypoint sh "$image" -c "command -v $build_tool >/dev/null 2>&1"; then
              echo "Unexpected build tool in Telegram bot runtime image: $build_tool" >&2
              exit 1
            fi
          done
