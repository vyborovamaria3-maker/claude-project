name: POTAPoff backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 10

    steps:
      - name: Require main workflow ref before accessing production SSH secrets
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production SSH workflow_dispatch requires main ref" >&2
            exit 1
          fi

      - name: Checkout audited SSH helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure pinned SSH (refuse unverified keys)
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          SERVER_SSH_HOST_KEY_SHA256: ${{ secrets.SERVER_SSH_HOST_KEY_SHA256 }}
        run: bash .github/scripts/prepare-pinned-ssh.sh

      - name: Create database backup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            /opt/potapoff-deploy/scripts/backup-production.sh
