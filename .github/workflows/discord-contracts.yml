name: Discord shared contracts
on:
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'packages/event-outbox/**'
      - 'discord-collector/**'
      - '.github/workflows/discord-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discord-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: potapoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DISCORD_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/potapoff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test shared contracts
        run: |
          npm --prefix packages/contracts install --ignore-scripts --no-package-lock
          npm --prefix packages/contracts run check
      - name: Typecheck shared outbox contract
        run: |
          npm --prefix packages/event-outbox install --ignore-scripts --no-package-lock
          npm --prefix packages/event-outbox run typecheck
      - name: Install collector and local contracts dependency
        run: npm --prefix discord-collector install --ignore-scripts --no-audit --no-fund
      - name: Test Discord collector and contract adapter
        run: node --test discord-collector/test/*.test.mjs
      - name: Syntax check Discord collector
        run: |
          node --check discord-collector/src/events.mjs
          node --check discord-collector/src/storage.mjs
          node --check discord-collector/src/reconcile.mjs
          node --check discord-collector/src/index.mjs
