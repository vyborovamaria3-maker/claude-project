name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
# P1 isolation: pull_request events execute untrusted PR code and must never land on the
# shared self-hosted runner; they run on ephemeral GitHub-hosted runners instead (free for
# public repositories). Trusted events (push to main) keep the central runner selection.
jobs:
  hygiene:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.POTAPOFF_RUNNER || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Check repository hygiene
        run: npm run hygiene:check
      - name: Verify release image trigger safety
        run: node --test scripts/release-trigger-policy.test.mjs scripts/release-sha-policy.test.mjs
