name: Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Repository hygiene
        run: npm run hygiene:check
      - name: Current-tree secret scan
        run: python3 security/audit/secret-scan.py --mode current
      - name: Temporary audit workflow must be absent
        run: test ! -e .github/workflows/security-lock-refresh.yml
      - name: Git diff integrity
        run: git diff --check

  potapoff-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Analysis regression
        run: npm run analysis:test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_FRONTEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Production dependency policy
        env:
          ALLOW_BIGINT_BUFFER_UNTIL: "2026-10-01"
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/frontend-audit.json" || true
          node ../security/audit/npm-audit-policy.mjs "$RUNNER_TEMP/frontend-audit.json"

  potapoff-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: potapoff
          POSTGRES_USER: potapoff
          POSTGRES_PASSWORD: potapoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U potapoff -d potapoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
      DATABASE_URL: postgresql+asyncpg://potapoff:potapoff@127.0.0.1:5432/potapoff
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      ENVIRONMENT: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: solana-launcher/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend and audit tooling
        run: |
          python -m pip install --upgrade "setuptools>=83"
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Full backend tests
        run: pytest -q
      - name: Migration head
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Python dependency audit
        run: pip-audit

  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intelligence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install intelligence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r intelligence/requirements.txt -r admin-site/requirements.txt
      - name: Prepare PostgreSQL schema and read-only role
        env:
          POTAPOFF_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5433/intelligence
        run: |
          python - <<'PY'
          import os
          import psycopg
          from intelligence.storage.postgres_schema import initialize_postgres_schema
          dsn = os.environ["POTAPOFF_TEST_POSTGRES_DSN"]
          initialize_postgres_schema(dsn)
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute("DROP ROLE IF EXISTS intelligence_readonly")
              connection.execute("CREATE ROLE intelligence_readonly LOGIN PASSWORD 'readonly'")
              connection.execute("GRANT CONNECT ON DATABASE intelligence TO intelligence_readonly")
              connection.execute("GRANT USAGE ON SCHEMA public TO intelligence_readonly")
              connection.execute("GRANT SELECT ON intelligence_documents, intelligence_jobs TO intelligence_readonly")
          PY
      - name: Full intelligence verification
        env:
          POTAPOFF_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5433/intelligence
          POTAPOFF_TEST_POSTGRES_READONLY_DSN: postgresql://intelligence_readonly:readonly@127.0.0.1:5433/intelligence
          ADMIN_STATE_DB_PASSWORD: ci-intelligence-compose-password
        run: python scripts/verify_intelligence.py --full --image-tag potapoff-intelligence:${{ github.sha }}
      - name: Scan intelligence image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: potapoff-intelligence:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  subscription:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: solana-subscription-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-subscription-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production dependency policy
        env:
          ALLOW_BIGINT_BUFFER_UNTIL: "2026-10-01"
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/subscription-audit.json" || true
          node ../security/audit/npm-audit-policy.mjs "$RUNNER_TEMP/subscription-audit.json"
      - name: Build production images locally
        env:
          NEXT_PUBLIC_API_URL: https://example.com/api
          NEXT_PUBLIC_WEB_URL: https://example.com
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: example_bot
          NEXT_PUBLIC_SOLANA_CLUSTER: mainnet-beta
          NEXT_PUBLIC_RPC_ENDPOINT: https://api.mainnet-beta.solana.com
          NEXT_PUBLIC_TREASURY_WALLET: 11111111111111111111111111111111
        run: |
          docker build -f apps/api/Dockerfile -t solsub-api:ci .
          docker build -f apps/bot/Dockerfile -t solsub-bot:ci .
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_WEB_URL="$NEXT_PUBLIC_WEB_URL" \
            --build-arg NEXT_PUBLIC_TELEGRAM_BOT_USERNAME="$NEXT_PUBLIC_TELEGRAM_BOT_USERNAME" \
            --build-arg NEXT_PUBLIC_SOLANA_CLUSTER="$NEXT_PUBLIC_SOLANA_CLUSTER" \
            --build-arg NEXT_PUBLIC_RPC_ENDPOINT="$NEXT_PUBLIC_RPC_ENDPOINT" \
            --build-arg NEXT_PUBLIC_TREASURY_WALLET="$NEXT_PUBLIC_TREASURY_WALLET" \
            -t solsub-web:ci .

  legacy-miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: telegram-miniapp/backend-new
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telegram-miniapp/backend-new/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build production image locally
        run: docker build -t legacy-miniapp:ci .

  production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: POTAPoff production compose
        working-directory: solana-launcher
        env:
          IMAGE_TAG: audit
          POSTGRES_PASSWORD: test-postgres
          RABBITMQ_PASSWORD: test-rabbit
          SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
          TELEGRAM_BOT_TOKEN: test-token
        run: |
          : > backend.env
          : > .env.server
          docker compose -f docker-compose.production.yml config >/tmp/potapoff-compose.yml
      - name: Subscription production compose
        working-directory: solana-subscription-service
        env:
          POSTGRES_PASSWORD: test-postgres-password
          REDIS_PASSWORD: test-redis-password
          SOLSUB_API_IMAGE: example.invalid/api:ci
          SOLSUB_WEB_IMAGE: example.invalid/web:ci
          SOLSUB_BOT_IMAGE: example.invalid/bot:ci
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config >/tmp/solsub-compose.yml
          rm -f .env
      - name: Legacy production compose
        working-directory: telegram-miniapp/backend-new
        env:
          LEGACY_MINIAPP_IMAGE: example.invalid/legacy:ci
        run: |
          cp .env.example .env.production
          sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' .env.production
          sed -i 's#^FRONTEND_URL=.*#FRONTEND_URL=https://example.com#' .env.production
          docker compose -f docker-compose.prod.yml config >/tmp/legacy-compose.yml
          rm -f .env.production

  ready:
    if: always()
    needs:
      - repository-security
      - potapoff-frontend
      - potapoff-backend
      - intelligence
      - subscription
      - legacy-miniapp
      - production-config
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS"
          test "${{ needs.repository-security.result }}" = success
          test "${{ needs.potapoff-frontend.result }}" = success
          test "${{ needs.potapoff-backend.result }}" = success
          test "${{ needs.intelligence.result }}" = success
          test "${{ needs.subscription.result }}" = success
          test "${{ needs.legacy-miniapp.result }}" = success
          test "${{ needs.production-config.result }}" = success
          echo "RELEASE_READY sha=${GITHUB_SHA}"
