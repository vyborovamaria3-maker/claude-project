name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current tracked files
        run: python3 security/audit/secret-scan.py --mode current

      - name: Scan newly introduced PR lines
        if: github.event_name == 'pull_request'
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 security/audit/secret-scan.py --mode diff --base "$AUDIT_BASE_SHA" --head "$AUDIT_HEAD_SHA"

      # Known historical leaks are tracked in SECRET_ROTATION_REQUIRED.md. A
      # blocking history scan on every PR would therefore stay red until a
      # coordinated history rewrite. Keep the full-history check explicit while
      # current/diff scans prevent any new secret from entering main.
      - name: Scan reachable git history
        if: github.event_name == 'workflow_dispatch'
        run: python3 security/audit/secret-scan.py --mode history
