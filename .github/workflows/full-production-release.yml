name: Full Production Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to release the current main SHA"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: full-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require explicit production confirmation
        env:
          CREDENTIAL_ROTATION_CONFIRMED: ${{ vars.SECURITY_CREDENTIAL_ROTATION_CONFIRMED }}
          PRODUCTION_PUBLIC_URL: ${{ vars.PRODUCTION_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.confirm }}" = "DEPLOY" || { echo 'Confirmation must be DEPLOY' >&2; exit 1; }
          test "${GITHUB_REF_NAME}" = "main" || { echo 'Full production release may only run from main' >&2; exit 1; }
          test "$CREDENTIAL_ROTATION_CONFIRMED" = "yes" || { echo 'SECURITY_CREDENTIAL_ROTATION_CONFIRMED must be yes after provider-side rotation of SEC-012/SEC-013' >&2; exit 1; }
          test -n "$PRODUCTION_PUBLIC_URL" || { echo 'PRODUCTION_PUBLIC_URL is required for post-deploy DAST' >&2; exit 1; }
          echo "FULL_RELEASE_CONFIRMED sha=${GITHUB_SHA}"

  readiness:
    needs: preflight
    uses: ./.github/workflows/release-readiness.yml
    secrets: inherit

  potapoff:
    needs: readiness
    uses: ./.github/workflows/potapoff-production.yml
    secrets: inherit

  subscription:
    needs: potapoff
    uses: ./.github/workflows/solana-subscription-production.yml
    secrets: inherit

  legacy-miniapp:
    needs: subscription
    uses: ./.github/workflows/legacy-miniapp-production.yml
    secrets: inherit

  production-dast:
    needs: legacy-miniapp
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Conservative production DAST
        env:
          AUDIT_TARGET: ${{ vars.PRODUCTION_PUBLIC_URL }}
          AUDIT_AUTHORIZED: "yes"
          AUDIT_PROFILE: production
          AUDIT_OUT: security/audit/reports/production-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$AUDIT_TARGET" || { echo 'PRODUCTION_PUBLIC_URL production variable is required' >&2; exit 1; }
          bash security/audit/run-dast.sh
      - name: Upload production DAST report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-dast-${{ github.sha }}
          path: security/audit/reports/production-${{ github.sha }}
          if-no-files-found: error

  complete:
    needs: production-dast
    runs-on: ubuntu-latest
    steps:
      - run: echo "FULL_PRODUCTION_RELEASE_OK sha=${GITHUB_SHA}"
