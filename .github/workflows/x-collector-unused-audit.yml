name: X Collector unused-code inventory
on:
  pull_request:
    paths:
      - 'x-collector/knip.jsonc'
      - 'x-collector/package.json'
      - 'x-collector/docs/CODE_INVENTORY_RU.md'
      - '.github/workflows/x-collector-unused-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  knip-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: x-collector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: x-collector/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Knip advisory report (never deletes files)
        shell: bash
        run: |
          set +e
          npm run audit:unused > "$RUNNER_TEMP/knip-output.log" 2> "$RUNNER_TEMP/knip-error.log"
          STATUS=$?
          set -e
          echo "Knip exit status: $STATUS (nonzero with findings is expected)"
          node - "$RUNNER_TEMP/knip-output.log" <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync(process.argv[2],'utf8');
          const start=text.indexOf('{"issues"');
          if(start<0) {console.error('Knip did not emit a valid issue report:',text.slice(0,1800));process.exit(1);}
          const report=JSON.parse(text.slice(start));
          const issues=report.issues??[];
          const unused=issues.flatMap(issue=>(issue.files??[]).map(v=>v.name??v));
          const intelligence=unused.filter(name=>name.startsWith('lib/intelligence/'));
          console.log('Knip issue rows:',issues.length);
          console.log('Potentially unused files:',unused.length);
          console.log('Potentially unused intelligence files:',intelligence.length);
          console.log('Candidate intelligence files (manual review):',JSON.stringify(intelligence.slice(0,80),null,2));
          console.log('Candidate files (manual review):',JSON.stringify(unused.slice(0,100),null,2));
          NODE
          echo "Nothing was removed. Dynamic CJS loaders and external CLI entrypoints require review."
          if [ "$STATUS" -gt 1 ]; then cat "$RUNNER_TEMP/knip-error.log"; exit "$STATUS"; fi
