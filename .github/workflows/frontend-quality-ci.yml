name: Frontend Quality CI

on:
  pull_request:
    paths:
      - "solana-launcher/**"
      - ".github/workflows/frontend-quality-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
jobs:
  accessibility-and-performance:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: solana-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json

      - name: Prepare isolated quality runtime
        run: |
          set -Eeuo pipefail
          quality_tmp="${RUNNER_TEMP}/potapoff-quality-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          rm -rf "$quality_tmp"
          mkdir -p "$quality_tmp/tools"
          quality_port="$(node - <<'NODE'
          const net = require('net');
          const server = net.createServer();
          server.listen(0, '127.0.0.1', () => {
            console.log(server.address().port);
            server.close();
          });
          NODE
          )"
          {
            echo "QUALITY_TMP=$quality_tmp"
            echo "QUALITY_LOG=$quality_tmp/next.log"
            echo "QUALITY_PID=$quality_tmp/next.pid"
            echo "QUALITY_TOOLS=$quality_tmp/tools"
            echo "QUALITY_PORT=$quality_port"
          } >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium for Lighthouse
        run: npx playwright install chromium

      - name: Build frontend from locked app dependencies
        run: npm run build

      - name: Start production-equivalent frontend
        run: |
          set -Eeuo pipefail
          rm -rf .next/standalone/public .next/standalone/.next/static
          mkdir -p .next/standalone/.next .next/standalone/node_modules
          test ! -d public || cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          rm -rf .next/standalone/node_modules/playwright .next/standalone/node_modules/playwright-core
          cp -R node_modules/playwright .next/standalone/node_modules/playwright
          cp -R node_modules/playwright-core .next/standalone/node_modules/playwright-core
          test -f .next/standalone/node_modules/playwright-core/browsers.json
          PORT="$QUALITY_PORT" HOSTNAME=127.0.0.1 node .next/standalone/server.js > "$QUALITY_LOG" 2>&1 &
          echo $! > "$QUALITY_PID"
          for i in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:${QUALITY_PORT}/login" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$QUALITY_LOG"
          exit 1

      - name: Cross-browser smoke
        run: |
          docker run --rm --network host --ipc=host \
            -e "BASE_URL=http://127.0.0.1:${QUALITY_PORT}" \
            -v "$PWD:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            node tests/cross-browser-smoke.mjs

      - name: Install isolated quality tools
        run: |
          set -Eeuo pipefail
          rm -rf "$QUALITY_TOOLS"
          mkdir -p "$QUALITY_TOOLS"
          cd "$QUALITY_TOOLS"
          npm init -y >/dev/null
          npm install --no-package-lock axe-core@4.10.2 lighthouse@12.8.2

      - name: Axe WCAG regression
        run: |
          BASE_URL="http://127.0.0.1:${QUALITY_PORT}" \
          AXE_SOURCE_PATH="$QUALITY_TOOLS/node_modules/axe-core/axe.min.js" \
          node tests/a11y-regression.mjs

      - name: Lighthouse mobile report
        run: |
          mkdir -p test-results/lighthouse
          CHROME_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          "$QUALITY_TOOLS/node_modules/.bin/lighthouse" "http://127.0.0.1:${QUALITY_PORT}/login" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=test-results/lighthouse/login.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/lighthouse/login.json', 'utf8'));
          const scores = Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, value.score || 0]));
          console.log('Lighthouse scores:', scores);
          if (scores.accessibility < 0.90) throw new Error(`Accessibility score too low: ${scores.accessibility}`);
          if (scores['best-practices'] < 0.85) throw new Error(`Best practices score too low: ${scores['best-practices']}`);
          if (scores.seo < 0.80) throw new Error(`SEO score too low: ${scores.seo}`);
          if (scores.performance < 0.65) throw new Error(`Performance score too low: ${scores.performance}`);
          NODE

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: frontend-quality-reports
          path: solana-launcher/test-results
          if-no-files-found: ignore

      - name: Print frontend log on failure
        if: failure()
        run: cat "$QUALITY_LOG" || true

      - name: Stop isolated frontend
        if: always()
        run: |
          if [[ -f "$QUALITY_PID" ]]; then
            pid="$(cat "$QUALITY_PID")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
