name: Production dispatch bridge

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    if: ${{ github.event.pull_request.title == '[DEPLOY] POTAPoff landing v2' }}
    uses: ./.github/workflows/potapoff-production.yml
    secrets: inherit

  record-result:
    needs: deploy
    if: always() && github.event.pull_request.title == '[DEPLOY] POTAPoff landing v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record bridge result
        env:
          RESULT: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .deployment
          {
            echo "result=$RESULT"
            echo "run_id=$RUN_ID"
            echo "sha=$SOURCE_SHA"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment/landing-bridge.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/landing-bridge.txt
          git commit -m "Record landing production bridge: $RESULT" || exit 0
          git push origin HEAD:main
