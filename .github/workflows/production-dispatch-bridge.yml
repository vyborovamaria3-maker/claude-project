name: Production dispatch bridge

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.issue.title == '[DEPLOY] POTAPoff landing v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch POTAPoff production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run potapoff-production.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "POTAPoff production dispatched"
