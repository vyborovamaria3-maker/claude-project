name: Landing comment production deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: landing-v2-production-hotdeploy
  cancel-in-progress: false

jobs:
  started:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/deploy-potapoff-landing-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record deployment start
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deployment
          {
            echo "state=started"
            echo "run_id=$RUN_ID"
            echo "trigger=issue_comment"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment/landing-comment-deploy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/landing-comment-deploy.txt
          git commit -m "Record landing comment deploy start" || exit 0
          git push origin HEAD:main

  deploy:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/deploy-potapoff-landing-v2' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Deploy landing frontend on production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          NEW_TAG="landing-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd /var/www/claude-project && git fetch origin main && git reset --hard origin/main && chmod +x solana-launcher/scripts/deploy-landing-hotfix.sh && solana-launcher/scripts/deploy-landing-hotfix.sh '$NEW_TAG'"

  record-result:
    needs: deploy
    if: always() && github.event.issue.pull_request && github.event.comment.body == '/deploy-potapoff-landing-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record deployment result
        env:
          RESULT: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deployment
          {
            echo "state=completed"
            echo "result=$RESULT"
            echo "run_id=$RUN_ID"
            echo "trigger=issue_comment"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment/landing-comment-deploy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/landing-comment-deploy.txt
          git commit -m "Record landing comment deploy: $RESULT" || exit 0
          git push origin HEAD:main
