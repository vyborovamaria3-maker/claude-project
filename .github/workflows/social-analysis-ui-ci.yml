name: Social Analysis UI CI

on:
  pull_request:
    paths:
      - "solana-launcher/app/trade/analysis/**"
      - "solana-launcher/app/x-analysis/**"
      - "solana-launcher/app/api/build-info/**"
      - "solana-launcher/components/trade/SocialIntelligencePanel.tsx"
      - "solana-launcher/components/trade/UnifiedAnalysisClient.tsx"
      - "solana-launcher/components/trade/BlockchainAiReportPanel.tsx"
      - "solana-launcher/tests/e2e/analysis-overview.mjs"
      - "solana-launcher/scripts/token-on-demand-regression.mjs"
      - "solana-launcher/components/providers/AppProviders.tsx"
      - "solana-launcher/components/providers/EncodingRepair.tsx"
      - "solana-launcher/public/sw.js"
      - "solana-launcher/scripts/healthcheck-production.sh"
      - "solana-launcher/Dockerfile.frontend.prod"
      - ".github/workflows/potapoff-production.yml"
      - ".github/workflows/social-analysis-ui-ci.yml"
  push:
    branches:
      - agent/social-analysis-integration
      - agent/fix-social-deploy-cache-encoding
  workflow_dispatch:

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
jobs:
  frontend:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: solana-launcher
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: "/fastapi"
      NEXT_PUBLIC_BUILD_SHA: "ci-test-build"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Service worker syntax check
        run: node --check public/sw.js
      - name: Production healthcheck syntax
        run: bash -n scripts/healthcheck-production.sh
      - name: Next production build
        run: npm run build
      - name: Install Chromium for unified analysis browser regression
        run: npx playwright install chromium
      - name: Start production frontend for unified analysis browser regression
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/unified-analysis-next.log"
          pid_file="$RUNNER_TEMP/unified-analysis-next.pid"
          PORT=3100 HOSTNAME=127.0.0.1 INTELLIGENCE_AI_ON_DEMAND_ENABLED=true npm run start >"$log_file" 2>&1 &
          echo "$!" >"$pid_file"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/trade/analysis >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$log_file"
          exit 1
      - name: Unified Analysis browser regression
        env:
          BASE_URL: http://127.0.0.1:3100
        run: npm run analysis-overview:test
      - name: Stop production frontend
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/unified-analysis-next.pid"
          if [[ -f "$pid_file" ]]; then
            pid="$(cat "$pid_file")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
