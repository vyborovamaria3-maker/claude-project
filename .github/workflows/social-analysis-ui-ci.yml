name: Social Analysis UI CI

# P1 runner isolation: pull_request events execute untrusted PR code and must
# never land on the shared self-hosted runner, so they run on ephemeral
  # GitHub-hosted runners. Push to main and manual dispatch on main keep the
  # central self-hosted selection; dispatch jobs refuse non-main refs.
on:
  pull_request:
    paths:
      - "solana-launcher/app/trade/analysis/**"
      - "solana-launcher/app/x-analysis/**"
      - "solana-launcher/app/api/build-info/**"
      - "solana-launcher/components/trade/SocialIntelligencePanel.tsx"
      - "solana-launcher/components/providers/AppProviders.tsx"
      - "solana-launcher/components/providers/EncodingRepair.tsx"
      - "solana-launcher/public/sw.js"
      - "solana-launcher/scripts/healthcheck-production.sh"
      - "solana-launcher/Dockerfile.frontend.prod"
      - ".github/workflows/potapoff-production.yml"
      - ".github/workflows/social-analysis-ui-ci.yml"
  push:
    branches:
      - main
    paths:
      - "solana-launcher/app/trade/analysis/**"
      - "solana-launcher/app/x-analysis/**"
      - "solana-launcher/app/api/build-info/**"
      - "solana-launcher/components/trade/SocialIntelligencePanel.tsx"
      - "solana-launcher/components/providers/AppProviders.tsx"
      - "solana-launcher/components/providers/EncodingRepair.tsx"
      - "solana-launcher/public/sw.js"
      - "solana-launcher/scripts/healthcheck-production.sh"
      - "solana-launcher/Dockerfile.frontend.prod"
      - ".github/workflows/potapoff-production.yml"
      - ".github/workflows/social-analysis-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
# workflow_dispatch runs the default-branch workflow file, but an operator may pick any
# ref; jobs below refuse non-main refs so untrusted branch code never reaches the runner.
jobs:
  frontend:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.POTAPOFF_RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: solana-launcher
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: "/fastapi"
      NEXT_PUBLIC_BUILD_SHA: "ci-test-build"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Service worker syntax check
        run: node --check public/sw.js
      - name: Production healthcheck syntax
        run: bash -n scripts/healthcheck-production.sh
      - name: Next production build
        run: npm run build
