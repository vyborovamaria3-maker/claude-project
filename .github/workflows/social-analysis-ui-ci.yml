name: Social Analysis UI CI

on:
  pull_request:
    paths:
      - "solana-launcher/app/trade/analysis/**"
      - "solana-launcher/app/x-analysis/**"
      - "solana-launcher/app/api/build-info/**"
      - "solana-launcher/app/api/trade/social-ai/**"
      - "solana-launcher/app/api/trade/social-source/**"
      - "solana-launcher/app/api/trade/dev-twitter/**"
      - "solana-launcher/app/api/token-history/**"
      - "solana-launcher/components/trade/SocialIntelligencePanel.tsx"
      - "solana-launcher/components/trade/SocialAnalysisChart.tsx"
      - "solana-launcher/components/chart/ActivityPanel.tsx"
      - "solana-launcher/hooks/useOHLCV.ts"
      - "solana-launcher/hooks/useTradeStream.ts"
      - "solana-launcher/lib/chart/**"
      - "solana-launcher/lib/trade/social-intelligence*.ts"
      - "solana-launcher/lib/trade/intelligence-agent*.ts"
      - "solana-launcher/components/providers/AppProviders.tsx"
      - "solana-launcher/components/providers/EncodingRepair.tsx"
      - "solana-launcher/scripts/analysis-regression.mjs"
      - "solana-launcher/scripts/live-intelligence-regression.mjs"
      - "solana-launcher/scripts/social-production-regression.mjs"
      - "solana-launcher/scripts/social-local-preflight.mjs"
      - "solana-launcher/scripts/x-login.mjs"
      - "solana-launcher/backend/app/cli/telegram_login.py"
      - "solana-launcher/backend/tests/test_telegram_login_cli.py"
      - "solana-launcher/docker-compose.production.yml"
      - "solana-launcher/.env.local.example"
      - "memecoin-intelligence/docker-compose.production.yml"
      - "memecoin-intelligence/.env.example"
      - "memecoin-intelligence/src/server/api/routes.ts"
      - "memecoin-intelligence/src/server/security/**"
      - "memecoin-intelligence/src/server/telegram-ai/**"
      - "solana-launcher/public/sw.js"
      - "solana-launcher/scripts/healthcheck-production.sh"
      - "solana-launcher/Dockerfile.frontend.prod"
      - ".github/workflows/potapoff-production.yml"
      - ".github/workflows/social-analysis-ui-ci.yml"
  push:
    branches:
      - agent/social-analysis-integration
      - agent/fix-social-deploy-cache-encoding
      - fix/trade-analysis-verdict-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-launcher
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: "/fastapi"
      NEXT_PUBLIC_BUILD_SHA: "ci-test-build"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Social analytics regression
        run: npm run analysis:test
      - name: X login script syntax
        run: node --check scripts/x-login.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Service worker syntax check
        run: node --check public/sw.js
      - name: Production healthcheck syntax
        run: bash -n scripts/healthcheck-production.sh
      - name: Next production build
        run: npm run build
