name: Intelligence foundation

on:
  pull_request:
    paths:
      - "intelligence/**"
      - "packages/contracts/**"
      - ".github/workflows/intelligence-foundation.yml"
  push:
    branches: [main]
    paths:
      - "intelligence/**"
      - "packages/contracts/**"
      - ".github/workflows/intelligence-foundation.yml"

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTELLIGENCE_TEST_DB_URL: postgresql://test:testpass@127.0.0.1:5432/intelligence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix packages/contracts --ignore-scripts --no-package-lock --no-audit
      - run: npm --prefix packages/contracts run check
      - run: npm install --prefix packages/event-outbox --no-package-lock --no-audit
      - run: npm --prefix packages/event-outbox run check
      - run: npm install --prefix intelligence --ignore-scripts --no-package-lock --no-audit
      - run: npm --prefix intelligence run check
