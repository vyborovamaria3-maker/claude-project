name: Shared contracts

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "discord-collector/**"
      - ".github/workflows/shared-contracts.yml"
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/shared-contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: potapoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DISCORD_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/potapoff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript compiler
        run: npm install --prefix packages/contracts --ignore-scripts --no-package-lock --no-audit
      - name: Strict typecheck, build, and regression tests
        run: npm --prefix packages/contracts run check
      - name: Build shared event-outbox package
        run: |
          npm install --prefix packages/event-outbox --ignore-scripts --no-audit --no-fund
          npm --prefix packages/event-outbox run build
      - name: Install Discord collector and local contracts package
        run: npm install --prefix discord-collector --ignore-scripts --no-audit --no-fund
      - name: Run Discord collector and contract integration tests
        run: node --test discord-collector/test/*.test.mjs
      - name: Check Discord collector syntax
        run: |
          node --check discord-collector/src/events.mjs
          node --check discord-collector/src/authorization-file.mjs
          node --check discord-collector/src/ingress-spool.mjs
          node --check discord-collector/src/storage.mjs
          node --check discord-collector/src/reconcile.mjs
          node --check discord-collector/src/permission-preflight.mjs
          node --check discord-collector/src/preflight-cli.mjs
          node --check discord-collector/src/erase-user.mjs
          node --check discord-collector/src/spool-replay.mjs
          node --check discord-collector/src/index.mjs
