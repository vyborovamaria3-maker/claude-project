name: POTAPoff landing release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: potapoff-landing-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_SSH_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "SERVER_SSH_KNOWN_HOSTS does not contain SERVER_HOST" >&2; exit 1; }

      - name: Build and deploy current main frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_USER"

          TAG="landing-main-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd /var/www/claude-project && \
             git fetch origin main && \
             git reset --hard origin/main && \
             chmod +x solana-launcher/scripts/deploy-landing-hotfix.sh && \
             solana-launcher/scripts/deploy-landing-hotfix.sh '$TAG'"

      - name: Verify public site
        run: |
          set -Eeuo pipefail
          LANDING_MARKER='Не смотри на рынок.'
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 15 https://www.potapoff.fun/ > /tmp/landing.html \
              && grep -Fq "$LANDING_MARKER" /tmp/landing.html \
              && curl -fsSL --max-time 15 https://www.potapoff.fun/dashboard >/dev/null; then
              echo "POTAPOFF_LANDING_LIVE"
              exit 0
            fi
            sleep 5
          done
          echo "Landing did not pass public verification" >&2
          exit 1
