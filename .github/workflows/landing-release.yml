name: POTAPoff landing release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: potapoff-landing-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    environment: production
    timeout-minutes: 45

    steps:
      - name: Require main workflow ref before accessing production SSH secrets
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production SSH workflow_dispatch requires main ref" >&2
            exit 1
          fi

      - name: Checkout audited SSH helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure pinned SSH (refuse unverified keys)
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          SERVER_SSH_HOST_KEY_SHA256: ${{ secrets.SERVER_SSH_HOST_KEY_SHA256 }}
        run: bash .github/scripts/prepare-pinned-ssh.sh

      - name: Build and deploy current main frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_USER"

          TAG="landing-main-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd /var/www/claude-project && \
             git fetch origin main && \
             git reset --hard origin/main && \
             chmod +x solana-launcher/scripts/deploy-landing-hotfix.sh && \
             solana-launcher/scripts/deploy-landing-hotfix.sh '$TAG'"

      - name: Verify public site
        run: |
          set -Eeuo pipefail
          LANDING_MARKER='Запускайте токены, анализируйте кошельки'
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 15 https://www.potapoff.fun/ > /tmp/landing.html \
              && grep -Fq "$LANDING_MARKER" /tmp/landing.html \
              && curl -fsSL --max-time 15 https://www.potapoff.fun/dashboard >/dev/null; then
              echo "POTAPOFF_LANDING_LIVE"
              exit 0
            fi
            sleep 5
          done
          echo "Landing did not pass public verification" >&2
          exit 1
