name: Apply Backtest Fixes PR v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-v2:
    if: github.head_ref == 'agent/fix-full-backtest-findings'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-backtest-findings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json

      - name: Skip when already applied
        id: state
        shell: bash
        run: |
          if [ -f .github/backtest-fixes-applied ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply audited source fixes
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_backtest_fixes.py
          python .github/scripts/apply_backtest_followups.py
          python .github/scripts/apply_backtest_semantics.py

      - name: Refresh lockfile without breaking upgrades
        if: steps.state.outputs.skip != 'true'
        working-directory: solana-launcher
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps
          npm audit fix --package-lock-only --legacy-peer-deps || true

      - name: Commit audited source changes
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'backtest-fix-bot'
          git config user.email 'backtest-fix-bot@users.noreply.github.com'
          git add solana-launcher .github/backtest-fixes-applied
          git diff --cached --stat
          git commit -m 'fix: address full backtest findings [backtest-fix-bot]'
          git push origin HEAD:agent/fix-full-backtest-findings
