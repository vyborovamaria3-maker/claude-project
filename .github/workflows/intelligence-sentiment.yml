name: Intelligence sentiment (offline)

on:
  pull_request:
    paths:
      - "intelligence/nlp/**"
      - "intelligence/requirements-sentiment.txt"
      - "intelligence/tests/test_sentiment*.py"
      - "intelligence/worker/jobs.py"
      - "intelligence/bootstrap.py"
      - ".github/workflows/intelligence-sentiment.yml"
  push:
    branches: [main]
    paths:
      - "intelligence/nlp/**"
      - "intelligence/requirements-sentiment.txt"
      - "intelligence/tests/test_sentiment*.py"
      - "intelligence/worker/jobs.py"
      - "intelligence/bootstrap.py"
      - ".github/workflows/intelligence-sentiment.yml"

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install lightweight existing database client for runtime imports
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Test routing, provenance, worker and CLI without model downloads
        run: python -m unittest intelligence.tests.test_sentiment intelligence.tests.test_sentiment_cli intelligence.tests.test_sentiment_sources intelligence.tests.test_sentiment_results_store intelligence.tests.test_sentiment_summary intelligence.tests.test_sentiment_benchmark intelligence.tests.test_worker_pipeline -v
      - name: Compile new Python modules
        run: python -m compileall -q intelligence/nlp intelligence/worker/jobs.py intelligence/bootstrap.py
