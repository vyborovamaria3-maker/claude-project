name: Full Backtest Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "solana-launcher/**"
      - ".github/workflows/full-backtest-audit.yml"

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - id: lint
        name: Package lint command
        continue-on-error: true
        run: npm run lint
      - id: typecheck
        name: TypeScript full project
        continue-on-error: true
        run: npx tsc --noEmit
      - id: syntax
        name: Node script syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
          done
      - id: build
        name: Next production build
        continue-on-error: true
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_FRONTEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_BUILD_SHA: audit
        run: npm run build
      - id: mobile
        name: Existing iPhone regression
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 3000 > /tmp/audit-next.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/login >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 node tests/mobile-regression.mjs
      - id: routes
        name: Exhaustive desktop and iPhone static route audit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 3001 > /tmp/audit-next-routes.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:3001/login >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3001 node tests/full-route-audit.mjs
      - id: audit
        name: Production dependency vulnerability audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend audit summary
        if: always()
        shell: bash
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "syntax=${{ steps.syntax.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          echo "mobile=${{ steps.mobile.outcome }}"
          echo "routes=${{ steps.routes.outcome }}"
          echo "npm_audit=${{ steps.audit.outcome }}"
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.syntax.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.mobile.outcome }}" = success
          test "${{ steps.routes.outcome }}" = success
          test "${{ steps.audit.outcome }}" = success

      - name: Upload route audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-route-audit
          path: solana-launcher/test-results/full-route-audit
          if-no-files-found: ignore

  backend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: potapoff
          POSTGRES_USER: potapoff
          POSTGRES_PASSWORD: potapoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U potapoff -d potapoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
      DATABASE_URL: postgresql+asyncpg://potapoff:potapoff@127.0.0.1:5432/potapoff
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      ENVIRONMENT: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: solana-launcher/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend and audit tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - id: pipcheck
        name: Python dependency consistency
        continue-on-error: true
        run: python -m pip check
      - id: compile
        name: Compile all Python
        continue-on-error: true
        run: python -m compileall -q app tests
      - id: ruff
        name: Ruff entire backend
        continue-on-error: true
        run: ruff check app tests
      - id: mypy
        name: Mypy entire backend
        continue-on-error: true
        run: mypy app
      - id: pytest
        name: Full pytest suite
        continue-on-error: true
        run: pytest -q
      - id: heads
        name: Single Alembic head
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic heads
      - id: migrate
        name: Fresh Postgres migration to head
        continue-on-error: true
        run: alembic upgrade head
      - id: downgrade
        name: Migration downgrade/upgrade round-trip
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          alembic downgrade base
          alembic upgrade head
      - id: api
        name: FastAPI health ready and OpenAPI smoke
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/audit-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8000/health
          curl --fail --show-error http://127.0.0.1:8000/ready
          curl --fail --show-error http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/openapi.json'))
          paths = data.get('paths', {})
          assert len(paths) >= 20, len(paths)
          assert '/api/v1/social/token/{mint}' in paths
          assert '/api/v1/telegram/token/{mint}' in paths
          print('OPENAPI_PATHS', len(paths))
          PY
      - id: pipaudit
        name: Python dependency vulnerability audit
        continue-on-error: true
        run: pip-audit

      - name: Backend audit summary
        if: always()
        shell: bash
        run: |
          echo "pipcheck=${{ steps.pipcheck.outcome }}"
          echo "compile=${{ steps.compile.outcome }}"
          echo "ruff=${{ steps.ruff.outcome }}"
          echo "mypy=${{ steps.mypy.outcome }}"
          echo "pytest=${{ steps.pytest.outcome }}"
          echo "heads=${{ steps.heads.outcome }}"
          echo "migrate=${{ steps.migrate.outcome }}"
          echo "downgrade=${{ steps.downgrade.outcome }}"
          echo "api=${{ steps.api.outcome }}"
          echo "pip_audit=${{ steps.pipaudit.outcome }}"
          test "${{ steps.pipcheck.outcome }}" = success
          test "${{ steps.compile.outcome }}" = success
          test "${{ steps.pytest.outcome }}" = success
          test "${{ steps.heads.outcome }}" = success
          test "${{ steps.migrate.outcome }}" = success
          test "${{ steps.api.outcome }}" = success
          test "${{ steps.pipaudit.outcome }}" = success

  production-config-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create empty CI env files
        run: |
          : > backend.env
          : > .env.server
      - id: shell
        name: Shell syntax for deployment scripts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.sh; do
            echo "bash -n $file"
            bash -n "$file"
          done
      - id: compose
        name: Production Compose render
        continue-on-error: true
        env:
          IMAGE_TAG: audit
          POSTGRES_PASSWORD: test-postgres
          RABBITMQ_PASSWORD: test-rabbit
          SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
          TELEGRAM_BOT_TOKEN: test-token
        run: |
          docker compose -f docker-compose.production.yml config >/tmp/compose.yml
          docker compose -f docker-compose.production.yml config --services
      - id: nginx
        name: Nginx config syntax in official image
        continue-on-error: true
        run: docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Production config summary
        if: always()
        shell: bash
        run: |
          echo "shell=${{ steps.shell.outcome }}"
          echo "compose=${{ steps.compose.outcome }}"
          echo "nginx=${{ steps.nginx.outcome }}"
          test "${{ steps.shell.outcome }}" = success
          test "${{ steps.compose.outcome }}" = success
          test "${{ steps.nginx.outcome }}" = success
