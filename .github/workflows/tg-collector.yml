name: TG Collector checks
on:
  pull_request:
    paths:
      - 'tg-collector/**'
      - 'solana-launcher/app/settings/TGCollectorTab.tsx'
      - 'solana-launcher/app/settings/TGGraphPanel.tsx'
      - 'solana-launcher/app/api/integrations/tg-collector/graph/**'
      - 'solana-launcher/app/settings/page.tsx'
      - 'solana-launcher/app/api/integrations/tg-collector/**'
      - '.github/workflows/tg-collector.yml'
  push:
    branches:
      - 'feature/tg-collector-mvp'
    paths:
      - 'tg-collector/**'
      - '.github/workflows/tg-collector.yml'
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tg_collector_test
          POSTGRES_USER: tg
          POSTGRES_PASSWORD: tg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg -d tg_collector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tg:tg@127.0.0.1:5432/tg_collector_test
    defaults:
      run:
        working-directory: tg-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and database integration tests
        run: npm test
      - name: PostgreSQL backup compatibility unit tests
        run: bash scripts/postgres-client-compat.test.sh
      - name: Backup and clean restore round-trip
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tg_sources(identifier,peer_id) VALUES('ci_backup_restore_fixture','9988776655')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tg_messages(source_id,message_id,text,posted_at,views) SELECT id,23,'Backup restoration fixture',now(),42 FROM tg_sources WHERE identifier='ci_backup_restore_fixture'"
          export TG_BACKUP_DIR="${RUNNER_TEMP}/tg-collector-backups"
          mkdir -p "$TG_BACKUP_DIR"
          docker run --rm --network host --entrypoint bash \
            -e DATABASE_URL="$DATABASE_URL" -e TG_BACKUP_DIR=/backup \
            -v "$PWD/scripts:/scripts:ro" -v "$TG_BACKUP_DIR:/backup" \
            postgres:16 -euo pipefail -c 'bash /scripts/backup.sh'
          archive="$(find "$TG_BACKUP_DIR" -name 'tg-collector-*.dump' -type f -print -quit)"
          test -s "$archive"
          test -s "$archive.sha256"
          archive_name="$(basename "$archive")"
          docker run --rm --network host --entrypoint bash \
            -e TG_BACKUP_ARCHIVE_NAME="$archive_name" \
            -v "$TG_BACKUP_DIR:/backup" \
            postgres:16 -euo pipefail -c 'sha256sum -c "/backup/$TG_BACKUP_ARCHIVE_NAME.sha256"'
          psql "postgresql://tg:tg@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE tg_collector_restore_ci"
          export TG_RESTORE_CHECK_DATABASE_URL="postgresql://tg:tg@127.0.0.1:5432/tg_collector_restore_ci"
          docker run --rm --network host --entrypoint bash \
            -e TG_RESTORE_CHECK_DATABASE_URL="$TG_RESTORE_CHECK_DATABASE_URL" \
            -e TG_BACKUP_ARCHIVE_NAME="$archive_name" \
            -v "$PWD/scripts:/scripts:ro" -v "$TG_BACKUP_DIR:/backup" \
            postgres:16 -euo pipefail -c 'bash /scripts/restore-check.sh "/backup/$TG_BACKUP_ARCHIVE_NAME"'
          DATABASE_URL="$TG_RESTORE_CHECK_DATABASE_URL" npm run migrate
          if docker run --rm --network host --entrypoint bash \
            -e TG_RESTORE_CHECK_DATABASE_URL="$TG_RESTORE_CHECK_DATABASE_URL" \
            -e TG_BACKUP_ARCHIVE_NAME="$archive_name" \
            -v "$PWD/scripts:/scripts:ro" -v "$TG_BACKUP_DIR:/backup" \
            postgres:16 -euo pipefail -c 'bash /scripts/restore-check.sh "/backup/$TG_BACKUP_ARCHIVE_NAME"'; then
            echo "ERROR: restore must refuse a nonempty target database" >&2
            exit 1
          fi
          actual="$(psql "$TG_RESTORE_CHECK_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM tg_messages m JOIN tg_sources s ON s.id=m.source_id WHERE s.identifier='ci_backup_restore_fixture' AND m.message_id=23 AND m.views=42")"
          test "$actual" = 1
          original="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM tg_messages")"
          restored="$(psql "$TG_RESTORE_CHECK_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM tg_messages")"
          test "$restored" = "$original"
          echo "PASS: complete PostgreSQL backup/restore integrity round-trip (${restored} messages)"

