name: Datasets + Discord foundation
on:
  pull_request:
    paths:
      - 'dataset-ingestion/**'
      - 'discord-collector/**'
      - 'docs/architecture/DISCORD_DATASETS_ROADMAP.md'
      - '.github/workflows/datasets-discord-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: potapoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DISCORD_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/potapoff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional PyArrow for bounded Parquet pilot
        run: python3 -m pip install --disable-pip-version-check -r dataset-ingestion/requirements-parquet.txt
      - name: Dataset fixture tests
        run: python3 -m unittest discover -s dataset-ingestion/tests -v
      - name: Dataset catalog JSON validation
        run: python3 -m json.tool dataset-ingestion/catalog.json >/dev/null
      - name: Discord dependency install (no live connections)
        run: npm --prefix discord-collector install --ignore-scripts --no-audit --no-fund
      - name: Discord unit and PostgreSQL integration tests
        run: node --test discord-collector/test/*.test.mjs
      - name: Discord syntax check
        run: |
          node --check discord-collector/src/events.mjs
          node --check discord-collector/src/storage.mjs
          node --check discord-collector/src/reconcile.mjs
          node --check discord-collector/src/index.mjs
