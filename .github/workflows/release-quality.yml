name: Release Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Production build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_FRONTEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Start production frontend
        run: |
          set -euo pipefail
          npm start -- -p 3000 > /tmp/potapoff-release-next.log 2>&1 &
          echo $! > /tmp/potapoff-release-next.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/potapoff-release-next.log
          exit 1
      - name: Cross-browser smoke
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/cross-browser-smoke.mjs
      - name: Mobile regression
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/mobile-regression.mjs
      - name: Full route audit
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/full-route-audit.mjs
      - name: Install isolated accessibility/performance tools
        run: |
          rm -rf /tmp/potapoff-quality-tools
          mkdir -p /tmp/potapoff-quality-tools
          cd /tmp/potapoff-quality-tools
          npm init -y >/dev/null
          npm install --no-package-lock axe-core@4.10.2 lighthouse@12.8.2
      - name: Axe WCAG regression
        env:
          BASE_URL: http://127.0.0.1:3000
          AXE_SOURCE_PATH: /tmp/potapoff-quality-tools/node_modules/axe-core/axe.min.js
        run: node tests/a11y-regression.mjs
      - name: Lighthouse mobile gate
        run: |
          set -euo pipefail
          mkdir -p test-results/lighthouse
          CHROME_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          /tmp/potapoff-quality-tools/node_modules/.bin/lighthouse http://127.0.0.1:3000/login \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=test-results/lighthouse/login.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/lighthouse/login.json', 'utf8'));
          const scores = Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, value.score || 0]));
          console.log('Lighthouse scores:', scores);
          if (scores.accessibility < 0.90) throw new Error(`Accessibility score too low: ${scores.accessibility}`);
          if (scores['best-practices'] < 0.85) throw new Error(`Best practices score too low: ${scores['best-practices']}`);
          if (scores.seo < 0.80) throw new Error(`SEO score too low: ${scores.seo}`);
          if (scores.performance < 0.65) throw new Error(`Performance score too low: ${scores.performance}`);
          NODE
      - name: Upload frontend quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-frontend-quality-${{ github.sha }}
          path: solana-launcher/test-results
          if-no-files-found: ignore
      - name: Print frontend log on failure
        if: failure()
        run: cat /tmp/potapoff-release-next.log || true

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: potapoff
          POSTGRES_USER: potapoff
          POSTGRES_PASSWORD: potapoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U potapoff -d potapoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: a9f4c2e8d7b1f6a3c9e5d2b8f7a4c1e9d6b3f8a2c5e7d4b9a1f3c6e8d2b7a5c9
      DATABASE_URL: postgresql+asyncpg://potapoff:potapoff@127.0.0.1:5432/potapoff
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      ENVIRONMENT: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: solana-launcher/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Single Alembic head
        run: test "$(alembic heads | grep -c '(head)')" -eq 1
      - name: Fresh migration to head
        run: alembic upgrade head
      - name: Migration downgrade/upgrade round-trip
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Runtime health and OpenAPI smoke
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/potapoff-release-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8000/health
          curl --fail --show-error http://127.0.0.1:8000/ready
          curl --fail --show-error http://127.0.0.1:8000/openapi.json -o /tmp/release-openapi.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/release-openapi.json'))
          paths = data.get('paths', {})
          assert len(paths) >= 20, len(paths)
          assert '/api/v1/social/token/{mint}' in paths
          assert '/api/v1/telegram/token/{mint}' in paths
          print('OPENAPI_PATHS', len(paths))
          PY

  quality-ready:
    if: always()
    needs: [frontend-quality, backend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require release quality gates
        run: |
          test "${{ needs.frontend-quality.result }}" = success
          test "${{ needs.backend-quality.result }}" = success
          echo "RELEASE_QUALITY_OK sha=${GITHUB_SHA}"
