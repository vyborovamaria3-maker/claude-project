name: X Collector quality
on:
  pull_request:
    paths:
      - 'x-collector/**'
      - '.github/workflows/x-collector-ci.yml'
  push:
    branches: [main]
    paths:
      - 'x-collector/**'
      - '.github/workflows/x-collector-ci.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: x_collector_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collector -d x_collector_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: x-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: x-collector/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run migrate:audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: node scripts/check-built-runtime.cjs
      - run: npm run test:db
        env:
          RUNTIME_TEST_DATABASE_URL: postgresql://collector:isolated_ci_fixture@127.0.0.1:5432/x_collector_test
      - run: npm run test:postgres
        env:
          REPLY_TEST_DATABASE_URL: postgresql://collector:isolated_ci_fixture@127.0.0.1:5432/x_collector_test

      - name: PostgreSQL backup and isolated restore round-trip
        env:
          DATABASE_URL: postgresql://collector:isolated_ci_fixture@127.0.0.1:5432/x_collector_test
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/x-collector-ci.dump"
          corrupt="${archive}.corrupt"
          restore_db="x_collector_restore_ci"
          restore_container="x-collector-pg-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$restore_container" >/dev/null 2>&1 || true
            rm -f "$archive" "$corrupt"
          }
          trap cleanup EXIT
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS public.x_backup_restore_fixture"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.x_backup_restore_fixture(id integer PRIMARY KEY, marker text NOT NULL)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.x_backup_restore_fixture VALUES(1,'x-collector-ci-fixture')"
          pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file="$archive"
          test -s "$archive"
          pg_restore --list "$archive" >/dev/null

          # The runner's pg_dump may be newer than the PostgreSQL 16 source.
          # Restore into an isolated matching PostgreSQL 17 target so newer
          # archive settings are never sent to the PG16 service.
          docker run -d --rm --network none --name "$restore_container" \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine >/dev/null
          ready=0
          for i in $(seq 1 60); do
            # The official image starts a temporary server during initdb.
            # Wait for initdb completion before probing the final server.
            if docker logs "$restore_container" 2>&1 | grep -q "PostgreSQL init process complete; ready for start up."; then
              if docker exec "$restore_container" pg_isready -h /var/run/postgresql -U postgres >/dev/null 2>&1 \
                && docker exec "$restore_container" psql -h /var/run/postgresql -U postgres -d postgres -X -Atq \
                  -v ON_ERROR_STOP=1 -c "SELECT 1" 2>/dev/null | grep -qx "1"; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            echo "Disposable PostgreSQL 17 restore target failed to reach final ready state" >&2
            docker logs "$restore_container" >&2 || true
            exit 1
          fi
          docker exec "$restore_container" createdb -U postgres "$restore_db"
          docker exec -i "$restore_container" pg_restore -U postgres -d "$restore_db" \
            --no-owner --no-privileges --exit-on-error --single-transaction < "$archive"
          restored="$(docker exec "$restore_container" psql -U postgres -d "$restore_db" -v ON_ERROR_STOP=1 -Atc "SELECT marker FROM public.x_backup_restore_fixture WHERE id=1")"
          test "$restored" = "x-collector-ci-fixture"
          head -c 64 "$archive" > "$corrupt"
          if pg_restore --list "$corrupt" >/dev/null 2>&1; then
            echo "ERROR: truncated X PostgreSQL backup was accepted" >&2
            exit 1
          fi
          echo "X_COLLECTOR_PG_BACKUP_RESTORE_OK isolated_restore=true corrupt_archive_rejected=true"
