name: X Collector quality
on:
  pull_request:
    paths:
      - 'x-collector/**'
      - '.github/workflows/x-collector-ci.yml'
  push:
    branches: [main]
    paths:
      - 'x-collector/**'
      - '.github/workflows/x-collector-ci.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: x_collector_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collector -d x_collector_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: x-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: x-collector/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:postgres
        env:
          REPLY_TEST_DATABASE_URL: postgresql://collector:isolated_ci_fixture@127.0.0.1:5432/x_collector_test
