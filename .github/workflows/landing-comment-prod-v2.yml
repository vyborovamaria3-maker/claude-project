name: Landing comment production deploy v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: landing-v2-production-hotdeploy
  cancel-in-progress: false

jobs:
  acknowledge:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 51 && github.event.comment.body == '/deploy-potapoff-landing-v2-final' }}
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="DEPLOY_STARTED run=${GITHUB_RUN_ID}"

  deploy:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 51 && github.event.comment.body == '/deploy-potapoff-landing-v2-final' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Deploy landing frontend on production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          NEW_TAG="landing-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd /var/www/claude-project && git fetch origin main && git reset --hard origin/main && chmod +x solana-launcher/scripts/deploy-landing-hotfix.sh && solana-launcher/scripts/deploy-landing-hotfix.sh '$NEW_TAG'"

  report:
    needs: deploy
    if: always() && github.event.issue.pull_request && github.event.issue.number == 51 && github.event.comment.body == '/deploy-potapoff-landing-v2-final'
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="DEPLOY_RESULT ${RESULT} run=${GITHUB_RUN_ID}"
