name: Mobile Responsive CI

on:
  pull_request:
    paths:
      - "solana-launcher/**"
      - ".github/workflows/mobile-responsive-ci.yml"

permissions:
  contents: read

# Runner selection is controlled centrally by POTAPOFF_RUNNER; self-hosted is the default.
jobs:
  mobile-user-smoke:
    runs-on: ${{ vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solana-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Start frontend
        run: |
          npm start -- -p 3000 > /tmp/potapoff-next.log 2>&1 &
          echo $! > /tmp/potapoff-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/potapoff-next.log
          exit 1

      - name: Walk site across phone and tablet widths
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/mobile-regression.mjs

      - name: Upload responsive screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-regression-screenshots
          path: solana-launcher/test-results/mobile
          if-no-files-found: ignore

      - name: Print frontend log on failure
        if: failure()
        run: cat /tmp/potapoff-next.log || true
