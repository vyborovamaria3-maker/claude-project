name: Mobile Responsive CI

on:
  pull_request:
    paths:
      - "solana-launcher/**"
      - ".github/workflows/mobile-responsive-ci.yml"

permissions:
  contents: read

jobs:
  mobile-user-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solana-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Start frontend
        run: |
          npm start -- -p 3000 > /tmp/potapoff-next.log 2>&1 &
          echo $! > /tmp/potapoff-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/potapoff-next.log
          exit 1

      - name: Walk site as iPhone user
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/mobile-regression.mjs

      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-regression-screenshots
          path: solana-launcher/test-results/mobile
          if-no-files-found: ignore

      - name: Print frontend log on failure
        if: failure()
        run: cat /tmp/potapoff-next.log || true