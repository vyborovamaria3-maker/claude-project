name: Landing direct production target

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.event.pull_request.title == '[TARGET PROD] POTAPoff landing v2' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Deploy verified landing frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          NEW_TAG="landing-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" bash -s -- "$NEW_TAG" <<'REMOTE'
          set -Eeuo pipefail
          NEW_TAG="$1"
          REPO_DIR="/var/www/claude-project"
          APP_DIR="$REPO_DIR/solana-launcher"
          DEPLOY_DIR="/opt/potapoff-deploy"
          COMPOSE_FILE="$DEPLOY_DIR/docker-compose.production.yml"
          IMAGE="ghcr.io/dima09090/claude-project/frontend:$NEW_TAG"

          cd "$REPO_DIR"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          test -f POTAPoff-landing-deploy-overlay-v2.zip
          python3 -m zipfile -e POTAPoff-landing-deploy-overlay-v2.zip .

          test -f solana-launcher/components/PublicLandingPage.tsx
          test -f solana-launcher/components/DashboardHomePage.tsx
          test -f solana-launcher/components/landing/landingContent.ts
          grep -q 'PublicLandingPage' solana-launcher/app/page.tsx
          grep -q 'DashboardHomePage' solana-launcher/app/dashboard/page.tsx
          git diff --check

          cd "$DEPLOY_DIR"
          COMPOSE=(docker compose --env-file .env.server -f "$COMPOSE_FILE")
          PREVIOUS_CONTAINER="$("${COMPOSE[@]}" ps -q frontend)"
          test -n "$PREVIOUS_CONTAINER"
          PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$PREVIOUS_CONTAINER")"
          PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
          test -n "$PREVIOUS_TAG"

          rollback() {
            code=$?
            trap - ERR
            echo "LANDING_DEPLOY_FAILED rollback_to=$PREVIOUS_TAG" >&2
            export IMAGE_TAG="$PREVIOUS_TAG"
            "${COMPOSE[@]}" up -d --no-deps --force-recreate frontend || true
            "${COMPOSE[@]}" restart nginx || true
            exit "$code"
          }
          trap rollback ERR

          cd "$APP_DIR"
          docker build \
            -f Dockerfile.frontend.prod \
            --build-arg NEXT_PUBLIC_APP_URL=https://potapoff.fun \
            --build-arg NEXT_PUBLIC_FRONTEND_URL=https://potapoff.fun \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://potapoff.fun/fastapi \
            --build-arg NEXT_PUBLIC_TELEGRAM_BOT_URL=https://t.me/Soft777bot \
            --build-arg NEXT_PUBLIC_BUILD_SHA="$NEW_TAG" \
            -t "$IMAGE" .

          cd "$DEPLOY_DIR"
          export IMAGE_TAG="$NEW_TAG"
          "${COMPOSE[@]}" up -d --no-deps --force-recreate frontend
          "${COMPOSE[@]}" restart nginx

          healthy=0
          for attempt in $(seq 1 45); do
            cid="$("${COMPOSE[@]}" ps -q frontend)"
            state="$(docker inspect --format '{{.State.Status}}' "$cid" 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || true)"
            if [[ "$state" == "running" && ( "$health" == "healthy" || "$health" == "none" ) ]]; then
              if curl -fsS http://127.0.0.1/ >/tmp/potapoff-landing.html \
                && grep -Fq 'Единый рабочий слой' /tmp/potapoff-landing.html \
                && curl -fsS http://127.0.0.1/miniapp >/dev/null \
                && curl -fsS http://127.0.0.1/fastapi/health >/dev/null \
                && curl -fsS http://127.0.0.1/api/build-info | grep -Fq "\"buildSha\":\"$NEW_TAG\""; then
                healthy=1
                break
              fi
            fi
            sleep 4
          done

          if [[ "$healthy" -ne 1 ]]; then
            "${COMPOSE[@]}" ps frontend nginx || true
            "${COMPOSE[@]}" logs --tail 120 frontend nginx || true
            false
          fi

          printf '%s\n' "$NEW_TAG" > "$DEPLOY_DIR/.frontend-hotfix-tag"
          trap - ERR
          cd "$REPO_DIR"
          git reset --hard origin/main
          git clean -fd
          echo "LANDING_DEPLOY_OK tag=$NEW_TAG previous=$PREVIOUS_TAG"
          REMOTE

  record-result:
    needs: deploy
    if: always() && github.event.pull_request.title == '[TARGET PROD] POTAPoff landing v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record result
        env:
          RESULT: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deployment
          {
            echo "result=$RESULT"
            echo "run_id=$RUN_ID"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment/landing-direct-target.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/landing-direct-target.txt
          git commit -m "Record direct landing deploy: $RESULT" || exit 0
          git push origin HEAD:main
