name: Apply Backtest Fixes PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-full-backtest-findings'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-backtest-findings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: solana-launcher/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skip when already applied
        id: state
        shell: bash
        run: |
          if [ -f .github/backtest-fixes-applied ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply source fixes
        if: steps.state.outputs.skip != 'true'
        run: python .github/scripts/apply_backtest_fixes.py

      - name: Refresh lockfile without force
        if: steps.state.outputs.skip != 'true'
        working-directory: solana-launcher
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps
          npm audit fix --package-lock-only --legacy-peer-deps || true

      - name: Verify fixed tree
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd solana-launcher
          npm ci --legacy-peer-deps
          npm run lint
          npx tsc --noEmit
          npm run build
          cd backend
          python -m pip install -e '.[dev]'
          ruff check app tests
          mypy app
          pytest -q

      - name: Commit validated fixes
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'backtest-fix-bot'
          git config user.email 'backtest-fix-bot@users.noreply.github.com'
          git add solana-launcher .github/backtest-fixes-applied
          git commit -m 'fix: address full backtest findings [backtest-fix-bot]'
          git push origin HEAD:agent/fix-full-backtest-findings
