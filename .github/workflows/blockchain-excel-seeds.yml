name: Blockchain Excel Seeds (fast)

on:
  pull_request:
    paths:
      - "solana-launcher/scripts/blockchain-seed-*.cjs"
      - "solana-launcher/scripts/blockchain-rpc-provenance*.cjs"
      - "solana-launcher/scripts/blockchain-rpc-recovery-authority*.cjs"
      - "solana-launcher/scripts/blockchain-rpc-rollback-anchor*.cjs"
      - "solana-launcher/scripts/blockchain-rpc-challenge-store*.cjs"
      - "solana-launcher/scripts/blockchain-swap-proof-validation*.cjs"
      - "solana-launcher/scripts/blockchain-alchemy-provider.cjs"
      - "solana-launcher/scripts/blockchain-pump-swap*.cjs"
      - "solana-launcher/scripts/blockchain-fee-*.cjs"
      - "solana-launcher/scripts/blockchain-collector-baseline.cjs"
      - "solana-launcher/scripts/blockchain-dex-adversarial-test.cjs"
      - "solana-launcher/scripts/blockchain-wallet-cache*.cjs"
      - "solana-launcher/scripts/blockchain-collector-regression.mjs"
      - "solana-launcher/scripts/blockchain-inventory-decoder.cjs"
      - "solana-launcher/scripts/blockchain-trade-reconciliation.cjs"
      - "solana-launcher/scripts/blockchain-trade-reconcile.cjs"
      - "solana-launcher/scripts/blockchain-trade-reconcile-test.cjs"
      - "solana-launcher/scripts/blockchain-signature-events*.cjs"
      - "solana-launcher/scripts/blockchain-buy-attribution*.cjs"
      - "solana-launcher/scripts/fixtures/*.json"
      - "solana-launcher/scripts/blockchain-live-contract-regression.cjs"
      - "solana-launcher/lib/trade/helius.ts"
      - "solana-launcher/scripts/blockchain-forensics*.cjs"
      - "solana-launcher/scripts/blockchain-dex-*.cjs"
      - "solana-launcher/app/api/blockchain/evidence/route.ts"
      - "solana-launcher/app/trade/analysis/evidence/page.tsx"
      - "solana-launcher/package.json"
      - ".github/workflows/blockchain-excel-seeds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: solana-launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run blockchain:test
      - run: npm run blockchain:integration-test
