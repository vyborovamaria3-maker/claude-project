name: POTAPoff hosted backend verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "solana-launcher/backend/**"
      - ".github/workflows/potapoff-backend-hosted-verify.yml"

permissions:
  contents: read

concurrency:
  group: potapoff-hosted-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-twitter-postgres:
    name: Hosted backend, Twitter tests and Alembic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: potapoff_ci
          POSTGRES_USER: potapoff
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U potapoff -d potapoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-signing-key-abcdefghijklmnopqrstuvwxyz-zyxwvutsrqponm
      DATABASE_URL: postgresql+asyncpg://potapoff:ci-postgres-password@127.0.0.1:55433/potapoff_ci
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solana-launcher/backend/pyproject.toml
      - name: Install backend with test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e 'solana-launcher/backend[dev]'
      - name: Validate Python syntax
        working-directory: solana-launcher/backend
        run: python -m compileall -q app tests
      - name: Ruff
        working-directory: solana-launcher/backend
        run: python -m ruff check app tests
      - name: Apply complete migration graph on PostgreSQL
        working-directory: solana-launcher/backend
        run: |
          set -Eeuo pipefail
          alembic upgrade heads
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          alembic current | grep -Fq '0021_twitter_run_singleton'
      - name: Run Twitter and migration regression tests
        working-directory: solana-launcher/backend
        run: pytest -q tests/test_twitter*.py tests/test_alembic_revision_ids.py
