name: Live Site Smoke Check

on:
  push:
    branches:
      - agent/live-site-smoke
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest production workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          runs="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/actions/workflows/potapoff-production.yml/runs?branch=main&per_page=5")"
          echo "$runs" | jq -r '.workflow_runs[] | "RUN id=\(.id) status=\(.status) conclusion=\(.conclusion) event=\(.event) head_sha=\(.head_sha) created=\(.created_at) updated=\(.updated_at)"'
          latest_id="$(echo "$runs" | jq -r '.workflow_runs[0].id // empty')"
          if [[ -n "$latest_id" ]]; then
            echo "=== LATEST PRODUCTION JOBS ==="
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/actions/runs/$latest_id/jobs?per_page=100" \
              | jq -r '.jobs[] | "JOB \(.name) status=\(.status) conclusion=\(.conclusion)" , (.steps[]? | "  STEP \(.number) \(.name) status=\(.status) conclusion=\(.conclusion)")'
          fi

      - name: Check production routes and cache headers
        shell: bash
        run: |
          set -u
          base="https://potapoff.fun"
          failed=0

          echo "=== DNS ==="
          getent ahosts potapoff.fun || true

          echo "=== BUILD INFO ==="
          build_code="$(curl --connect-timeout 5 --max-time 15 -sS --retry 2 --retry-delay 2 -o /tmp/build.json -w '%{http_code}' "$base/api/build-info" || true)"
          echo "HTTP=$build_code"
          cat /tmp/build.json 2>/dev/null || true
          echo
          [[ "$build_code" == "200" ]] || failed=1

          for path in / /trade/analysis /trade/analysis/social /x-analysis; do
            echo "=== $path ==="
            code="$(curl --connect-timeout 5 --max-time 15 -sS --retry 2 --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$path" || true)"
            echo "HTTP=$code"
            bytes="$(wc -c < /tmp/page.html 2>/dev/null | tr -d ' ' || echo 0)"
            echo "BYTES=$bytes"
            grep -Eo 'X \+ Telegram|Social Intelligence|On-chain|Анализ X|РђРЅР°Р»РёР· X' /tmp/page.html 2>/dev/null | head -20 || true
            if grep -qE 'Рђ|РўСЂ|РњРѕ|вЂ|В·' /tmp/page.html 2>/dev/null; then
              echo "MOJIBAKE_IN_SERVER_HTML=yes"
            else
              echo "MOJIBAKE_IN_SERVER_HTML=no"
            fi
            [[ "$code" == "200" ]] || failed=1
          done

          echo "=== SERVICE WORKER HEADERS ==="
          curl --connect-timeout 5 --max-time 15 -sSI --retry 2 --retry-delay 2 "$base/sw.js" | tr -d '\r' | tee /tmp/sw.headers || failed=1
          grep -i '^cache-control:' /tmp/sw.headers || true

          if [[ "$failed" -ne 0 ]]; then
            echo "LIVE_SMOKE_FAILED"
            exit 1
          fi
          echo "LIVE_SMOKE_OK"

  server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production containers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -u
            cd /opt/potapoff-deploy
            echo "=== CURRENT TAG ==="
            cat .current-image-tag 2>/dev/null || true
            echo "=== PREVIOUS TAG ==="
            cat .previous-image-tag 2>/dev/null || true
            echo "=== COMPOSE PS ==="
            docker compose --env-file .env.server -f docker-compose.production.yml ps || true
            echo "=== LOCAL ENDPOINTS ==="
            for path in / /trade/analysis /trade/analysis/social /api/build-info /fastapi/health; do
              code=$(curl --connect-timeout 2 --max-time 5 -sS -o /tmp/check.out -w "%{http_code}" "http://127.0.0.1$path" || true)
              echo "$path HTTP=$code"
              if [ "$path" = "/api/build-info" ]; then cat /tmp/check.out 2>/dev/null || true; echo; fi
            done
            echo "=== RECENT APP LOGS ==="
            docker compose --env-file .env.server -f docker-compose.production.yml logs --tail 60 backend frontend nginx 2>&1 || true
          '
