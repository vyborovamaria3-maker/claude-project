name: Security Lock Refresh

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.head_ref == 'security/full-audit-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Refresh solana-launcher lockfile
        working-directory: solana-launcher
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Refresh subscription-service lockfile
        working-directory: solana-subscription-service
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfiles
        run: |
          git config user.name 'security-audit-bot'
          git config user.email 'security-audit-bot@users.noreply.github.com'
          git add solana-launcher/package-lock.json solana-subscription-service/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git commit -m 'security: refresh audited npm lockfiles'
          git push origin HEAD:${{ github.head_ref }}
