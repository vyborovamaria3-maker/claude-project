name: Security Lock Refresh

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    # Explicit trust boundary for a write-capable workflow on a PR code
    # path: the branch-name equality check alone is NOT authorization -
    # any account can create a fork branch with the same name. The gate
    # therefore requires ALL of: the head branch lives in this repository
    # (no forks), the PR was opened by the repository owner, and the actor
    # who triggered this event is the owner too. On synchronize events the
    # actor is the pusher; on re-runs it is the re-run initiator. This is
    # an account/access-control fence, NOT a commit-provenance fence: it
    # does not verify who authored the commits already on the branch.
    if: >-
      github.head_ref == 'security/full-audit-20260818' &&
      github.event.pull_request.head.repo.full_name == 'vyborovamaria3-maker/claude-project' &&
      github.event.pull_request.user.login == 'vyborovamaria3-maker' &&
      github.actor == 'vyborovamaria3-maker'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.POTAPOFF_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Refresh solana-launcher lockfile
        working-directory: solana-launcher
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Refresh subscription-service lockfile
        working-directory: solana-subscription-service
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfiles
        run: |
          git config user.name 'security-audit-bot'
          git config user.email 'security-audit-bot@users.noreply.github.com'
          git add solana-launcher/package-lock.json solana-subscription-service/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git commit -m 'security: refresh audited npm lockfiles'
          git push origin HEAD:${{ github.head_ref }}
