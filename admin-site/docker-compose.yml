services:
  admin:
    build: .
    container_name: potapoff-admin
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_INTELLIGENCE_DB: /data/intelligence/intelligence.sqlite3
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./sources.json:/config/sources.json:ro
      - ./logs.json:/config/logs.json:ro
      - ../solana-launcher/data:/data/launcher:ro
      - ../telegram-miniapp/backend-new/prisma:/data/miniapp:ro
      - admin-state:/var/lib/potapoff-admin
      - intelligence-state:/data/intelligence:ro
      - /var/log/potapoff:/logs/apps:ro
      - admin-logs:/logs/docker:ro
    networks:
      - admin-internal
      - potapoff-shared
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  intelligence-worker:
    build:
      context: ../intelligence
    container_name: potapoff-intelligence
    restart: unless-stopped
    environment:
      POTAPOFF_INTELLIGENCE_DB: /var/lib/potapoff-intelligence/intelligence.sqlite3
    volumes:
      - intelligence-state:/var/lib/potapoff-intelligence
    networks:
      - potapoff-shared
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import os, shutil; assert shutil.which('yt-dlp'); assert shutil.which('deno'); assert os.access('/var/lib/potapoff-intelligence', os.W_OK)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  log-collector:
    image: fluent/fluent-bit:3.2
    profiles: ["host-logs"]
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - admin-logs:/output
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  admin-internal:
    internal: true
  potapoff-shared:
    external: true

volumes:
  admin-state:
  admin-logs:
  intelligence-state:
