services:
  admin-postgres:
    image: postgres:17-alpine
    container_name: potapoff-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: potapoff_admin
      POSTGRES_USER: potapoff_admin
      POSTGRES_PASSWORD: ${ADMIN_STATE_DB_PASSWORD:?Set ADMIN_STATE_DB_PASSWORD in admin-site/.env}
    volumes:
      - admin-postgres-state:/var/lib/postgresql/data
    networks:
      - admin-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potapoff_admin -d potapoff_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin:
    build: .
    container_name: potapoff-admin
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_INTELLIGENCE_DB: /data/intelligence/intelligence.sqlite3
      ADMIN_STATE_POSTGRES_DSN: postgresql://potapoff_admin:${ADMIN_STATE_DB_PASSWORD:?Set ADMIN_STATE_DB_PASSWORD in admin-site/.env}@admin-postgres:5432/potapoff_admin
      POTAPOFF_BACKEND_URL: http://backend:8000
      POTAPOFF_SUBSCRIPTION_ADMIN_KEY: ${SUBSCRIPTION_ADMIN_KEY:?Set SUBSCRIPTION_ADMIN_KEY for subscription admin}
    depends_on:
      admin-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./sources.json:/config/sources.json:ro
      - ./logs.json:/config/logs.json:ro
      - ../solana-launcher/data:/data/launcher:ro
      - ../telegram-miniapp/backend-new/prisma:/data/miniapp:ro
      - admin-state:/var/lib/potapoff-admin
      - intelligence-state:/data/intelligence:ro
      - /var/log/potapoff:/logs/apps:ro
      - admin-logs:/logs/docker:ro
    networks:
      - admin-internal
      - potapoff-shared
      - potapoff-data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  intelligence-worker:
    build:
      context: ../intelligence
    container_name: potapoff-intelligence
    restart: unless-stopped
    env_file: .env.intelligence
    environment:
      POTAPOFF_INTELLIGENCE_DB: /var/lib/potapoff-intelligence/intelligence.sqlite3
    volumes:
      - intelligence-state:/var/lib/potapoff-intelligence
    networks:
      - potapoff-shared
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "intelligence", "runtime-health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  log-collector:
    image: fluent/fluent-bit:3.2
    profiles: ["host-logs"]
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - admin-logs:/output
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  admin-internal:
    internal: true
  potapoff-shared:
    external: true
  potapoff-data:
    external: true
    name: potapoff_default

volumes:
  admin-state:
  admin-postgres-state:
  admin-logs:
  intelligence-state:
