<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>POTAPoff Control Center v1</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/analysis-profiles-v2.css" />
  <link rel="stylesheet" href="/static/analysis-profiles-v3.css" />
  <link rel="stylesheet" href="/static/analysis-editor-v4.css" />
  <link rel="stylesheet" href="/static/analysis-confirm-v5.css" />
  <link rel="stylesheet" href="/static/security-ui-v7.css" />
  <link rel="stylesheet" href="/static/theme-picker.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <main id="loginView" class="login-shell hidden">
    <section class="login-card">
      <div class="brand-mark">P</div>
      <p class="eyebrow">POTAPoff / secure console</p>
      <h1>Administrator</h1>
      <p class="muted">Единая read-only панель для баз, блокчейна, Telegram, X, пользователей и логов.</p>
      <form id="loginForm" class="stack">
        <label>Логин<input id="loginUsername" autocomplete="username" required /></label>
        <label>Пароль<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <button class="primary" type="submit">Войти</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </section>
  </main>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">P</div>
        <div><strong>POTAPoff</strong><span>Control Center v1</span></div>
      </div>
      <nav id="navigation">
        <button data-view="overview" class="nav-item active"><span>01</span>Обзор</button>
        <button data-view="database" class="nav-item"><span>02</span>Базы данных</button>
        <button data-view="blockchain" class="nav-item"><span>03</span>Блокчейн</button>
        <button data-view="telegram" class="nav-item"><span>04</span>Telegram</button>
        <button data-view="x" class="nav-item"><span>05</span>X / Twitter</button>
        <button data-view="users" class="nav-item"><span>06</span>Пользователи</button>
        <button data-view="logs" class="nav-item"><span>07</span>Логи</button>
        <button data-view="search" class="nav-item"><span>08</span>Глобальный поиск</button>
        <button data-view="graph" class="nav-item"><span>09</span>Граф связей</button>
        <button data-view="queues" class="nav-item"><span>10</span>Очереди</button>
        <button data-view="monitoring" class="nav-item"><span>11</span>Мониторинг</button>
        <button data-view="control" class="nav-item"><span>12</span>Control Center</button>
        <button id="analysisProfilesNav" class="nav-item"><span>13</span>Параметры анализа</button>
        <button data-view="audit" class="nav-item"><span>14</span>Аудит</button>
      </nav>
      <div class="sidebar-footer">
        <span id="adminIdentity">admin</span>
        <button id="logoutButton" class="ghost">Выйти</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">CENTRAL OPERATIONS</p>
          <h2 id="viewTitle">Обзор системы</h2>
        </div>
        <div class="topbar-actions">
          <span id="systemClock" class="mono"></span>
          <button id="refreshButton" class="secondary">Обновить</button>
        </div>
      </header>

      <div id="content" class="content"></div>
    </section>
  </div>

  <template id="loadingTemplate">
    <div class="loading"><span></span><p>Загрузка данных…</p></div>
  </template>

  <script src="/static/theme-picker.js" defer></script>
  <script src="/static/security-ui-v7.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/database-migrated-v8.js" defer></script>
  <script src="/static/database-deeplink-v8.js" defer></script>
  <script src="/static/analysis-confirm-v5.js" defer></script>
  <script src="/static/analysis-ui-guard-v6.js" defer></script>
  <script src="/static/analysis-profiles-v4.js" defer></script>
  <script src="/static/analysis-cancel-silence-v5.js" defer></script>
</body>
</html>
